<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4facfe"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Target circles -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.3"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.5"/>
  <circle cx="256" cy="256" r="60" fill="url(#accent)" opacity="0.2"/>
  
  <!-- Sword -->
  <g transform="translate(256, 256)">
    <!-- Blade -->
    <rect x="-8" y="-120" width="16" height="160" rx="4" fill="url(#accent)"/>
    <!-- Guard -->
    <rect x="-40" y="40" width="80" height="12" rx="6" fill="url(#accent)"/>
    <!-- Handle -->
    <rect x="-6" y="52" width="12" height="40" rx="3" fill="#a78bfa"/>
    <!-- Pommel -->
    <circle cx="0" cy="98" r="10" fill="url(#accent)"/>
    <!-- Blade tip -->
    <polygon points="-8,-120 8,-120 0,-140" fill="url(#accent)"/>
  </g>
  
  <!-- Shield -->
  <g transform="translate(320, 200)">
    <path d="M 0,-40 L 30,-30 L 35,10 L 20,40 L 0,50 L -20,40 L -35,10 L -30,-30 Z" 
          fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.8"/>
    <path d="M 0,-25 L 18,-18 L 21,6 L 12,24 L 0,30 L -12,24 L -21,6 L -18,-18 Z" 
          fill="url(#accent)" opacity="0.3"/>
  </g>
  
  <!-- Star/sparkle decorations -->
  <circle cx="150" cy="150" r="4" fill="#feca57" opacity="0.8"/>
  <circle cx="380" cy="350" r="3" fill="#4facfe" opacity="0.8"/>
  <circle cx="120" cy="380" r="3" fill="#f093fb" opacity="0.8"/>
</svg>
