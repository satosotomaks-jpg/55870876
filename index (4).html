/* ================= ДЕЙСТВИЯ ================= */
function afterComplete(res) {
  if (!res.ok) { toast(res.msg || 'Не получилось', 'bad'); return; }
  const bits = [`+${res.xp} XP`, `+${res.gold} 🪙`];
  if (res.attr) bits.push(`+${res.attrGain} ${ATTRS[res.attr].name}`);
  if (res.prog) bits.push(`+${fmt(res.prog)} ${S.goal.metric.unit}`);
  toast('✅ ' + bits.join(' · '), 'good');
  if (res.tired) toast('Сделано через силу: −здоровье', 'bad');
  if (res.chapter) setTimeout(() => toast('🗺️ Открыта ' + res.chapter, 'gold'), 700);
  (res.ach || []).forEach((a, i) => setTimeout(() => toast(a.icon + ' Достижение: ' + a.title, 'gold'), 1100 + i * 600));
  if (res.levels && res.levels.length) setTimeout(() => levelUpFX(res.levels[res.levels.length - 1]), 350);
  render();
}

function tickFocus() {
  if (!S || !S.focus) return;
  const left = S.focus.end - Date.now();
  if (left <= 0) {
    const r = finishFocus();
    if (r.ok) {
      toast('🎯 Фокус завершён: +' + r.bonus + ' XP', 'good');
      (r.ach || []).forEach((a, i) => setTimeout(() => toast(a.icon + ' ' + a.title, 'gold'), 600 + i * 600));
      if (r.levels.length) setTimeout(() => levelUpFX(r.levels[r.levels.length - 1]), 300);
      render();
    }
    return;
  }
  const el = document.getElementById('focusTime');
  if (el) {
    el.textContent = String(Math.floor(left / 60000)).padStart(2, '0') + ':' + String(Math.floor(left % 60000 / 1000)).padStart(2, '0');
  }
}

function checkDay() {
  if (!S) return;
  const rep = rollover();
  if (rep) {
    if (rep.burnout) toast('💀 Выгорание! Персонаж потерял золото и серию', 'bad');
    else if (rep.damage) toast('Пропущены привычки: −' + rep.damage + ' ❤️', 'bad');
    toast('🌅 Новый день: квесты обновлены', 'good');
    render();
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;

  /* --- онбординг --- */
  if (act === 'ob-ava') { readOBInputs(); OB.avatar = t.dataset.ava; renderOB(); return; }
  if (act === 'ob-goal') {
    readOBInputs();
    OB.goalId = t.dataset.goal;
    OB.metricLabel = ''; OB.metricUnit = ''; OB.metricTarget = '';
    if (OB.forNew) sheet('Новая кампания', goalPickerBody(OB) + '<div class="tiny muted" style="margin-top:8px">Уровень, статы и золото сохранятся.</div>', `<button class="btn primary block" data-act="ob-next">Дальше →</button>`);
    else renderOB();
    return;
  }
  if (act === 'ob-cat') {
    readOBInputs();
    const c = t.dataset.cat;
    OB.customCats = OB.customCats || [];
    if (OB.customCats.includes(c)) OB.customCats = OB.customCats.filter(x => x !== c);
    else OB.customCats = [...OB.customCats, c].slice(-2);
    if (OB.forNew) sheet('Новая кампания', goalPickerBody(OB), `<button class="btn primary block" data-act="ob-next">Дальше →</button>`);
    else renderOB();
    return;
  }
  if (act === 'ob-mode') { readOBInputs(); OB.mode = t.dataset.mode; renderOB(); return; }
  if (act === 'ob-next') { obNext(); return; }
  if (act === 'ob-back') {
    readOBInputs();
    if (OB.forNew) { OB.step = 1; sheet('Новая кампания', goalPickerBody(OB), `<button class="btn primary block" data-act="ob-next">Дальше →</button>`); return; }
    OB.step = Math.max(0, OB.step - 1); renderOB(); return;
  }
  if (act === 'ob-finish') {
    readOBInputs();
    newGame({
      name: OB.name.trim() || 'Игрок', avatar: OB.avatar, goalId: OB.goalId,
      customTitle: OB.customTitle.trim(), customCats: OB.customCats,
      metricLabel: OB.metricLabel, metricUnit: OB.metricUnit, metricTarget: OB.metricTarget,
      deadline: OB.deadline || null, mode: OB.mode
    });
    OB = null; TAB = 'quests'; render();
    setTimeout(() => toast('Кампания началась. Первый квест уже ждёт ⚔️', 'good'), 300);
    return;
  }
  if (act === 'ob-start-new') {
    readOBInputs();
    startNewGoal({
      goalId: OB.goalId, customTitle: OB.customTitle.trim(), customCats: OB.customCats,
      metricLabel: OB.metricLabel, metricUnit: OB.metricUnit, metricTarget: OB.metricTarget, deadline: OB.deadline || null
    });
    OB = null; closeModal(); TAB = 'goal'; render();
    toast('🎯 Новая кампания началась', 'good');
    return;
  }

  /* --- модальные --- */
  if (act === 'close') { closeModal(); return; }
  if (act === 'close-lvl') { const el = document.querySelector('.levelup'); if (el) el.remove(); return; }

  if (!S) return;

  /* --- навигация --- */
  if (act === 'tab') { TAB = t.dataset.tab; try { localStorage.setItem('liferpg.tab', TAB); } catch (err) {} render(); window.scrollTo(0, 0); return; }

  /* --- квесты --- */
  if (act === 'quest') { openQuest(id); return; }
  if (act === 'done') {
    const inp = document.getElementById('qProg');
    const extra = inp ? { prog: Number(inp.value) } : null;
    const res = complete(id, extra);
    closeModal();
    afterComplete(res);
    return;
  }
  if (act === 'reroll') { const r = reroll(id); closeModal(); if (r.ok) { toast('🎲 Квест заменён', ''); render(); } else toast(r.msg || 'Нечем заменить', 'bad'); return; }
  if (act === 'skip') { const r = skipQuest(id); closeModal(); if (r.ok) { toast('Квест убран', ''); render(); } else toast(r.msg, 'bad'); return; }
  if (act === 'unhabit') { removeHabit(id); closeModal(); toast('Привычка удалена', ''); render(); return; }
  if (act === 'addquest') { openAddQuest(); return; }
  if (act === 'pick-cat') {
    document.querySelectorAll('#cCats .pick').forEach(p => p.classList.remove('on'));
    t.classList.add('on'); return;
  }
  if (act === 'pick-rec') {
    t.parentNode.querySelectorAll('.pick').forEach(p => p.classList.remove('on'));
    t.classList.add('on'); return;
  }
  if (act === 'save-quest') {
    const title = document.getElementById('cTitle').value.trim();
    if (!title) { toast('Напиши, что нужно сделать', 'bad'); return; }
    const catBtn = document.querySelector('#cCats .pick.on');
    const recBtn = document.querySelector('[data-act="pick-rec"].on');
    addCustom({
      title, desc: document.getElementById('cDesc').value.trim(),
      cat: catBtn ? catBtn.dataset.cat : 'order',
      diff: document.getElementById('cDiff').value,
      minutes: document.getElementById('cMin').value,
      prog: document.getElementById('cProg').value,
      recurring: recBtn && recBtn.dataset.rec === '1'
    });
    closeModal(); render(); toast('Квест добавлен', 'good'); return;
  }

  /* --- фокус --- */
  if (act === 'focus') {
    const min = Number(t.dataset.min) || 25;
    startFocus(min, id || null);
    closeModal(); TAB = 'quests'; render();
    toast('🎯 Фокус ' + min + ' минут. Убери телефон.', 'good');
    return;
  }
  if (act === 'focus-cancel') { cancelFocus(); render(); toast('Сессия прервана — опыт не начислен', 'bad'); return; }

  /* --- цель --- */
  if (act === 'progress') { openProgress(); return; }
  if (act === 'save-progress') {
    const v = Number(document.getElementById('pVal').value);
    const r = addProgress(v);
    closeModal();
    if (r.ok) { toast((v > 0 ? '+' : '') + fmt(v) + ' ' + S.goal.metric.unit + ' к цели', 'good'); render(); }
    else toast('Введи число', 'bad');
    return;
  }
  if (act === 'editgoal') { openEditGoal(); return; }
  if (act === 'save-goal') {
    setGoalFields({
      title: document.getElementById('gTitle').value.trim(),
      metricLabel: document.getElementById('gLabel').value.trim(),
      metricUnit: document.getElementById('gUnit').value.trim(),
      metricTarget: document.getElementById('gTarget').value,
      deadline: document.getElementById('gDeadline').value || null
    });
    closeModal(); render(); toast('Цель обновлена', 'good'); return;
  }
  if (act === 'newgoal') { openNewGoal(); return; }

  /* --- лавка --- */
  if (act === 'buy') {
    const r = buy(id);
    if (!r.ok) { toast(r.msg, 'bad'); return; }
    toast(r.item.icon + ' Куплено: ' + r.item.title + '. Возьми это в реале!', 'gold');
    (r.ach || []).forEach((a, i) => setTimeout(() => toast(a.icon + ' ' + a.title, 'gold'), 700 + i * 600));
    render(); return;
  }
  if (act === 'addshop') { openAddShop(); return; }
  if (act === 'save-shop') {
    const title = document.getElementById('sTitle').value.trim();
    if (!title) { toast('Напиши название награды', 'bad'); return; }
    addShopItem({
      title, desc: document.getElementById('sDesc').value.trim(),
      price: document.getElementById('sPrice').value, icon: document.getElementById('sIcon').value.trim() || '🎁',
      energy: document.getElementById('sEnergy').value, hp: document.getElementById('sHp').value
    });
    closeModal(); render(); toast('Награда в лавке', 'gold'); return;
  }

  /* --- журнал / настройки --- */
  if (act === 'mode') { setMode(t.dataset.mode); render(); toast('Режим: ' + MODES[S.mode].name, ''); return; }
  if (act === 'ach') {
    const a = ACHIEVEMENTS.find(x => x.id === id);
    const got = S.ach[a.id];
    sheet(a.icon + ' ' + esc(a.title), `<div class="card tight small">${esc(a.desc)}</div>
      <div class="tiny muted" style="margin-top:10px">${got ? 'Получено ' + new Date(got).toLocaleDateString('ru-RU') : 'Ещё не получено'}</div>`,
      `<button class="btn ghost block" data-act="close">Закрыть</button>`);
    return;
  }
  if (act === 'export') {
    const blob = new Blob([exportSave()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'liferpg-' + S.name.replace(/\s+/g, '_') + '-' + S.today + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Копия сохранения скачана', 'good'); return;
  }
  if (act === 'import') { document.getElementById('importFile').click(); return; }
  if (act === 'reset') {
    sheet('Сбросить персонажа?', `<div class="card tight small">Уровень ${S.level}, ${S.questsDone} квестов, ${fmt(S.gold)} золота и вся кампания будут удалены. Отменить нельзя.</div>
      <div class="tiny muted" style="margin-top:10px">Сначала можно сохранить копию в разделе «Данные».</div>`,
      `<button class="btn danger block" data-act="reset-yes">Удалить и начать заново</button>
       <button class="btn ghost block" style="margin-top:9px" data-act="close">Отмена</button>`);
    return;
  }
  if (act === 'reset-yes') { wipe(); closeModal(); startOB(); return; }
});

document.addEventListener('change', e => {
  if (e.target.id !== 'importFile') return;
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const r = importSave(String(rd.result));
    if (r.ok) { render(); toast('Персонаж загружен', 'good'); }
    else toast(r.msg, 'bad');
  };
  rd.readAsText(f);
});

/* ================= СТАРТ ================= */
function boot() {
  const ok = load();
  if (ok) {
    try { TAB = localStorage.getItem('liferpg.tab') || 'quests'; } catch (e) {}
    if (S.focus && Date.now() >= S.focus.end) {
      const r = finishFocus();
      if (r.ok) setTimeout(() => toast('🎯 Фокус-сессия завершена: +' + r.bonus + ' XP', 'good'), 600);
    }
    checkDay();
    render();
  } else {
    startOB();
  }
  if (TICK) clearInterval(TICK);
  TICK = setInterval(() => { tickFocus(); }, 1000);
  setInterval(checkDay, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkDay(); if (S) render(); } });
}
window.addEventListener('DOMContentLoaded', boot);
</script>
<script>
/* ============================================================
   LIFE RPG v2 — несколько целей, замеры, заметки, косметика,
   серии и напоминания. Совместимо с сохранениями v1.
   ============================================================ */
(function () {
'use strict';

const V2 = 2;
const orig = {
  load, newGame, startNewGoal, rollover, complete, addProgress, setGoalFields,
  buy, importSave, finishFocus, screenLog, screenHero, renderHUD, renderNav,
  render, openEditGoal, renderOBStep2, rollSide, exportSave
};

/* ---------- каталоги косметики ---------- */
const SKINS = [
  { id:'skin-neon', title:'Неоновый странник', desc:'Светящийся костюм и визор.', price:120, icon:'🕶️', cfg:{outfit:'#7c5cff',accessory:'visor',aura:'#7c5cff'} },
  { id:'skin-knight', title:'Рыцарь порядка', desc:'Броня и плащ для дисциплины.', price:180, icon:'🛡️', cfg:{outfit:'#8a93a8',accessory:'helmet',aura:'#ffd166'} },
  { id:'skin-mage', title:'Маг фокуса', desc:'Мантия и посох глубокой работы.', price:220, icon:'🧙', cfg:{outfit:'#4b2e83',accessory:'hat',aura:'#b06cff'} },
  { id:'skin-cyber', title:'Кибер-ниндзя', desc:'Тёмный костюм и кибер-маска.', price:260, icon:'🥷', cfg:{outfit:'#111827',accessory:'mask',aura:'#00e0b8'} },
  { id:'skin-gold', title:'Золотой чемпион', desc:'Золотая броня и корона.', price:400, icon:'👑', cfg:{outfit:'#d4a017',accessory:'crown',aura:'#ffd166'} },
  { id:'skin-zen', title:'Дзен-странник', desc:'Спокойный образ и нимб.', price:300, icon:'🧘', cfg:{outfit:'#2f8f7f',accessory:'halo',aura:'#6ff0cf'} }
];
const BGS = [
  { id:'bg-black', title:'Чёрный', desc:'Базовый тёмный фон.', price:0, icon:'⬛', css:'#05060a' },
  { id:'bg-white', title:'Белый', desc:'Базовый светлый фон.', price:0, icon:'⬜', css:'#f4f5fb', light:true },
  { id:'bg-purple', title:'Фиолетовый', desc:'Базовый фирменный фон.', price:0, icon:'🟪', css:'#1a1440' },
  { id:'bg-aurora', title:'Аврора', desc:'Северное сияние.', price:150, icon:'🌌', css:'linear-gradient(160deg,#071a2b,#123c46 45%,#3b1d5e)' },
  { id:'bg-ocean', title:'Океан', desc:'Глубокая вода.', price:150, icon:'🌊', css:'linear-gradient(160deg,#031a2e,#064663 55%,#0a7e8c)' },
  { id:'bg-sunset', title:'Закат', desc:'Тёплый вечер.', price:180, icon:'🌇', css:'linear-gradient(160deg,#2b0f2e,#7a2341 50%,#c2571b)' },
  { id:'bg-matrix', title:'Матрица', desc:'Цифровой дождь.', price:220, icon:'🟩', css:'linear-gradient(160deg,#020b05,#062b16 55%,#0b4d2a)' }
];
const HAIR_COLORS = ['#2b2118','#4a3324','#8a5a2b','#c9a24b','#b84a39','#6b4fc9','#2f8f7f','#d9d9e3'];
const SKIN_TONES = ['#f6d3b3','#e8b98f','#c98e62','#a06a42','#6f4529','#4a2e1d'];
const OUTFITS = ['#7c5cff','#00b894','#2d9cdb','#eb5757','#f2c94c','#8a93a8','#111827','#ffffff'];
const HAIRS = [['short','Короткие'],['long','Длинные'],['curly','Кудри'],['bun','Пучок'],['none','Без волос']];
const ACCESSORIES = [['none','Нет'],['glasses','Очки'],['visor','Визор'],['mask','Маска'],['hat','Шляпа'],['helmet','Шлем'],['crown','Корона'],['halo','Нимб']];

/* ---------- расширение состояния ---------- */
function defaultMeasureFields(g) {
  const c = g.cats || [];
  if (c.includes('money')) return [
    {key:'balance',label:'Накоплено',unit:'₽'}, {key:'income',label:'Доход за месяц',unit:'₽'}, {key:'expenses',label:'Расходы за месяц',unit:'₽'}
  ];
  if (c.includes('body')) return [
    {key:'weight',label:'Вес',unit:'кг'}, {key:'waist',label:'Талия',unit:'см'}, {key:'chest',label:'Грудь',unit:'см'}, {key:'hips',label:'Бёдра',unit:'см'},
    {key:'sleep',label:'Сон',unit:'ч'}, {key:'energy',label:'Энергия',unit:'1–10'}
  ];
  if (g.id === 'balance') return [
    {key:'sleep',label:'Сон',unit:'ч'}, {key:'energy',label:'Энергия',unit:'1–10'}, {key:'anxiety',label:'Тревога',unit:'1–10'}, {key:'focus',label:'Фокус',unit:'1–10'}
  ];
  return [ {key:'score',label:'Текущий уровень',unit:'балл'}, {key:'hours',label:'Практика за неделю',unit:'ч'}, {key:'confidence',label:'Уверенность',unit:'1–10'} ];
}
function newGoalRecord(base, o) {
  const metric = {
    label: o.metricLabel || base.metric.label, unit: o.metricUnit || base.metric.unit,
    target: Number(o.metricTarget) > 0 ? Number(o.metricTarget) : base.metric.target
  };
  return {
    uid: 'g' + uid(), id: base.id, emoji: base.emoji, title: base.title, hint: base.hint, cats: base.cats,
    metric, progress: 0, deadline: o.deadline || null, startedAt: todayStr(),
    chapters: base.chapters.map(ch => ({ title: ch.title, story: ch.story.map(T), boss: T(ch.boss), done: [], bossDone: false })),
    chapterIdx: 0, storyIdx: 0, completed: false,
    habits: base.habits.map(a => Object.assign(T(a), { uid: uid(), kind:'habit', streak:0, best:0 })),
    sidePool: base.side.map(T), quests: [], habitDone: {}, dayBuilt: null,
    measureFields: defaultMeasureFields(base), measurements: [], results: []
  };
}
function baseFor(o) {
  return o.goalId === 'custom' ? customCampaign(o.customTitle || 'Моя цель', o.customCats) : clone(GOALS.find(g => g.id === o.goalId) || GOALS[0]);
}
function normalize() {
  if (!S) return;
  S.v = V2;
  if (!S.goals) {
    const g = S.goal;
    g.uid = g.uid || 'g' + uid();
    g.habits = S.habits || []; g.sidePool = S.sidePool || []; g.quests = S.quests || [];
    g.habitDone = S.habitDone || {}; g.dayBuilt = S.today;
    g.measureFields = g.measureFields || defaultMeasureFields(g);
    g.measurements = g.measurements || []; g.results = g.results || [];
    S.goals = [g]; S.activeGoalId = g.uid;
  }
  S.goals.forEach(g => {
    g.uid = g.uid || 'g' + uid();
    g.habits = g.habits || []; g.sidePool = g.sidePool || []; g.quests = g.quests || [];
    g.habitDone = g.habitDone || {}; g.measureFields = g.measureFields || defaultMeasureFields(g);
    g.measurements = g.measurements || []; g.results = g.results || [];
  });
  if (!S.goals.find(g => g.uid === S.activeGoalId)) S.activeGoalId = S.goals[0].uid;
  S.notes = S.notes || [];
  S.cosmetics = S.cosmetics || { ownedSkins:[], ownedBgs:['bg-black','bg-white','bg-purple'], skin:null, bg:'bg-purple', avatar:null };
  S.cosmetics.ownedBgs = Array.from(new Set(['bg-black','bg-white','bg-purple'].concat(S.cosmetics.ownedBgs || [])));
  S.cosmetics.ownedSkins = S.cosmetics.ownedSkins || [];
  S.settings = Object.assign({ hints:true, notifDaily:false, notifTime:'20:00', notifStreak:true, notifDeadline:true, notifFocus:true, lastNotif:{} }, S.settings || {});
  S.streakFreezes = S.streakFreezes || 0;
  S.shop = [];
  activateGoal(S.activeGoalId, true);
  applyTheme();
}
function activateGoal(id, silent) {
  const g = S.goals.find(x => x.uid === id) || S.goals[0];
  S.activeGoalId = g.uid; S.goal = g;
  S.habits = g.habits; S.sidePool = g.sidePool; S.quests = g.quests; S.habitDone = g.habitDone;
  if (g.dayBuilt !== S.today) { buildDaily(); g.dayBuilt = S.today; }
  if (!silent) { pushLog('Переключение на цель «' + g.title + '». Прогресс сохранён.', 'info'); save(); }
}
function activeGoals() { return S.goals.filter(g => !g.completed); }

/* ---------- темы и аватар ---------- */
function applyTheme() {
  if (!S) return;
  const bg = BGS.find(b => b.id === S.cosmetics.bg) || BGS[2];
  document.body.dataset.bg = bg.id;
  document.body.classList.toggle('light', !!bg.light);
  document.body.style.background = bg.css;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = bg.light ? '#f4f5fb' : '#070a12';
}
function avatarCfg() {
  return Object.assign({ skin:SKIN_TONES[1], hair:'short', hairColor:HAIR_COLORS[0], outfit:OUTFITS[0], accessory:'none', aura:null }, S.cosmetics.avatar || {});
}
function avatarSVG(cfg, size) {
  cfg = Object.assign({ skin:SKIN_TONES[1], hair:'short', hairColor:HAIR_COLORS[0], outfit:OUTFITS[0], accessory:'none', aura:null }, cfg || {});
  const s = size || 48;
  let hair = '';
  if (cfg.hair === 'short') hair = `<path d="M20 30 Q22 14 32 14 Q42 14 44 30 Q40 22 32 22 Q24 22 20 30Z" fill="${cfg.hairColor}"/>`;
  else if (cfg.hair === 'long') hair = `<path d="M18 32 Q18 12 32 12 Q46 12 46 32 L46 46 Q42 40 40 30 Q36 22 32 22 Q28 22 24 30 Q22 40 18 46Z" fill="${cfg.hairColor}"/>`;
  else if (cfg.hair === 'curly') hair = `<g fill="${cfg.hairColor}"><circle cx="22" cy="22" r="6"/><circle cx="28" cy="17" r="6"/><circle cx="36" cy="17" r="6"/><circle cx="42" cy="22" r="6"/><circle cx="20" cy="29" r="5"/><circle cx="44" cy="29" r="5"/></g>`;
  else if (cfg.hair === 'bun') hair = `<circle cx="32" cy="12" r="6" fill="${cfg.hairColor}"/><path d="M20 30 Q22 16 32 16 Q42 16 44 30 Q38 23 32 23 Q26 23 20 30Z" fill="${cfg.hairColor}"/>`;
  let acc = '';
  if (cfg.accessory === 'glasses') acc = `<g fill="none" stroke="#1b2430" stroke-width="2"><circle cx="26" cy="32" r="5"/><circle cx="38" cy="32" r="5"/><path d="M31 32h2"/></g>`;
  else if (cfg.accessory === 'visor') acc = `<rect x="21" y="28" width="22" height="7" rx="3" fill="#00e0b8" opacity=".85"/>`;
  else if (cfg.accessory === 'mask') acc = `<path d="M22 34 Q32 42 42 34 L42 40 Q32 46 22 40Z" fill="#111827"/>`;
  else if (cfg.accessory === 'hat') acc = `<path d="M18 24 L32 4 L46 24Z" fill="#4b2e83"/><rect x="16" y="22" width="32" height="5" rx="2" fill="#6b46c1"/>`;
  else if (cfg.accessory === 'helmet') acc = `<path d="M19 28 Q20 12 32 12 Q44 12 45 28 L45 31 L19 31Z" fill="#9aa3b5"/><rect x="29" y="12" width="6" height="19" fill="#6c7689"/>`;
  else if (cfg.accessory === 'crown') acc = `<path d="M22 18 L25 8 L30 15 L32 6 L34 15 L39 8 L42 18Z" fill="#ffd166"/>`;
  else if (cfg.accessory === 'halo') acc = `<ellipse cx="32" cy="9" rx="12" ry="4" fill="none" stroke="#ffd166" stroke-width="3"/>`;
  const aura = cfg.aura ? `<circle cx="32" cy="32" r="30" fill="none" stroke="${cfg.aura}" stroke-width="2" opacity=".7"/>` : '';
  return `<svg viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true">${aura}<circle cx="32" cy="32" r="30" fill="rgba(255,255,255,.06)"/>${hair}<circle cx="32" cy="33" r="13" fill="${cfg.skin}"/><path d="M14 60 Q16 46 32 46 Q48 46 50 60Z" fill="${cfg.outfit}"/><circle cx="27" cy="32" r="1.8" fill="#1b2430"/><circle cx="37" cy="32" r="1.8" fill="#1b2430"/><path d="M28 38 Q32 41 36 38" fill="none" stroke="#1b2430" stroke-width="1.6" stroke-linecap="round"/>${acc}</svg>`;
}
function heroAvatar(size) { return avatarSVG(avatarCfg(), size || 48); }

/* ---------- серии ---------- */
function dayActive(d) { const h = S.history[d]; return !!(h && ((h.done || 0) > 0 || h.protected)); }
function recomputeStreak() {
  let d = S.today, n = 0;
  if (!dayActive(d)) d = shiftDay(d, -1);
  while (dayActive(d)) { n++; d = shiftDay(d, -1); }
  S.streak = n; S.bestStreak = Math.max(S.bestStreak || 0, n);
}

/* ---------- напоминания ---------- */
function notifSupported() { return 'Notification' in window; }
function notifPermission() { return notifSupported() ? Notification.permission : 'unsupported'; }
async function requestNotif() {
  if (!notifSupported()) { toast('Браузер не поддерживает уведомления', 'bad'); return; }
  try {
    const p = await Notification.requestPermission();
    if (p === 'granted') { S.settings.notifDaily = true; save(); toast('Уведомления включены', 'good'); }
    else toast('Разрешение не выдано. Его можно включить в настройках браузера.', 'bad');
  } catch (e) { toast('Не удалось запросить разрешение', 'bad'); }
  render();
}
function sendNotif(title, body, tag) {
  if (notifPermission() !== 'granted') return;
  const opts = { body, tag: tag || 'liferpg', icon:'icon-192.png', badge:'icon-192.png', data:{ url: location.href } };
  if (navigator.serviceWorker && navigator.serviceWorker.ready) {
    navigator.serviceWorker.ready.then(reg => reg.showNotification(title, opts)).catch(() => { try { new Notification(title, opts); } catch (e) {} });
  } else { try { new Notification(title, opts); } catch (e) {} }
}
function checkReminders() {
  if (!S || notifPermission() !== 'granted') return;
  const st = S.settings, now = new Date(), t = S.today;
  st.lastNotif = st.lastNotif || {};
  const hhmm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const active = activeGoals();
  if (st.notifDaily && hhmm >= (st.notifTime || '20:00') && st.lastNotif.daily !== t) {
    st.lastNotif.daily = t;
    const left = S.quests.length + S.habits.filter(h => !habitDoneToday(h.uid)).length;
    sendNotif('Life RPG: квесты ждут', left ? 'Осталось ' + left + ' заданий. Закрой хотя бы одно, чтобы продолжить серию.' : 'День закрыт. Отличная работа!', 'daily');
    save();
  }
  if (st.notifStreak && st.notifDaily && hhmm >= '21:00' && (S.streak || 0) > 0 && !dayActive(t) && st.lastNotif.streak !== t) {
    st.lastNotif.streak = t;
    sendNotif('Серия под угрозой 🔥', 'До конца дня осталось мало времени. Один квест спасёт серию ' + S.streak + ' дней.', 'streak');
    save();
  }
  if (st.notifDeadline && st.notifDaily && hhmm >= '09:00' && st.lastNotif.deadline !== t) {
    const soon = active.map(g => ({ g, dl: daysLeftFor(g) })).filter(x => x.dl !== null && x.dl >= 0 && x.dl <= 3);
    if (soon.length) {
      st.lastNotif.deadline = t;
      sendNotif('Дедлайн близко ⏳', soon.map(x => x.g.title + ': ' + x.dl + ' дн.').join(' · '), 'deadline');
      save();
    }
  }
}
function daysLeftFor(g) { return g.deadline ? dayDiff(S.today, g.deadline) : null; }
function settingsCard() {
  const p = notifPermission(), st = S.settings;
  const status = p === 'granted' ? '✅ разрешены' : p === 'denied' ? '🚫 запрещены браузером' : p === 'unsupported' ? 'не поддерживаются' : 'не запрошены';
  return `<div class="sec-title">🔔 Напоминания</div><div class="card tight">
    <div class="spread"><div><b>Уведомления</b><div class="tiny muted">Статус: ${status}</div></div>

    <div class="field" style="margin-top:10px"><label>Время ежедневного напоминания</label><input type="time" id="notifTime" value="${st.notifTime || '20:00'}" data-change="notif-time"></div>

}

rollSide = function () {
  S.quests = S.quests.filter(q => q.kind !== 'side');
  const rand = seeded(hashStr(S.today + '|' + S.goal.uid + '|' + S.level));
  const recent = [];
  for (let i = 1; i <= 3; i++) { const h = S.history[shiftDay(S.today, -i)]; if (h && h.titles) recent.push(...h.titles); }
  const pool = S.sidePool.concat(GENERIC_SIDE.map(T)).filter(q => !recent.includes(q.title));
  const weak = Object.keys(S.attrs).sort((a,b) => S.attrs[a] - S.attrs[b]).slice(0,2);
  const weighted = [];
  pool.forEach(q => { let w = 1; if (S.goal.cats.includes(q.cat)) w += 2; if (weak.includes(CATS[q.cat].attr)) w += 1; if (q.diff === 3 && S.level < 3) w = Math.max(1, w - 2); for (let i=0;i<w;i++) weighted.push(q); });
  const count = S.level >= 5 ? 6 : 5;
  const picked = []; let guard = 0;
  while (picked.length < count && weighted.length && guard++ < 300) { const q = weighted[Math.floor(rand()*weighted.length)]; if (!picked.some(p => p.title === q.title)) picked.push(clone(q)); }
  picked.forEach(q => S.quests.push(Object.assign(q, { uid:uid(), kind:'side', date:S.today })));
  sortQuests();
};

load = function () { const ok = orig.load(); if (ok) normalize(); return ok; };

  const g = newGoalRecord(baseFor(o), o);
  S.goals.push(g); activateGoal(g.uid);
  pushLog('Новая кампания: «' + g.title + '». Персонаж и прежние цели сохранены.', 'story');
  save(); return { ok:true };
};
rollover = function () {
  const t = todayStr(); if (!S || S.today === t) return null;
  const gap = clamp(dayDiff(S.today, t), 1, 365);
  const report = { missed:0, damage:0, streakLost:false, newDay:t, burnout:false };
  const pen = MODES[S.mode].penalty;
  for (let i = 0; i < Math.min(gap, 3); i++) {
    const day = shiftDay(S.today, i);
    S.goals.forEach(g => {
      const doneIds = g.habitDone[day] || [];
      const missed = g.habits.filter(h => !doneIds.includes(h.uid));
      missed.forEach(m => { m.streak = 0; });
      if (i === 0 && g.uid === S.activeGoalId) {
        const h = hist(day); h.missed = (h.missed || 0) + missed.length;
        if (missed.length && pen > 0) { const dmg = missed.length * pen; S.hp -= dmg; report.missed += missed.length; report.damage += dmg; }
      }
    });
    if (!dayActive(day) && i > 0) {
      if (S.streakFreezes > 0) { S.streakFreezes--; hist(day).protected = true; pushLog('🧊 Защита серии спасла день ' + dateHuman(day) + '.', 'good'); }
    }
  }
  if (S.hp <= 0) { S.hp = Math.round(maxHP()*0.35); const lost = Math.round(S.gold*0.15); S.gold -= lost; report.burnout = true; pushLog('Выгорание. −' + fmt(lost) + ' золота. Отдохни и вернись.', 'bad'); }
  else if (report.damage > 0) pushLog('Пропущено привычек: ' + report.missed + '. Здоровье −' + report.damage + '.', 'bad');
  const oldStreak = S.streak || 0;
  S.today = t; S.energy = maxEnergy(); S.hp = clamp(S.hp + 4, 0, maxHP()); hist(t);
  S.goals.forEach(g => { activateGoal(g.uid, true); });
  activateGoal(S.activeGoalId, true);
  recomputeStreak(); if (oldStreak > 0 && S.streak === 0) report.streakLost = true;
  pushLog('Новый день. Квесты обновлены, энергия восстановлена.', 'day');
  checkAch(); save(); return report;
};
complete = function (id, extra) {
  const q = findQuest(id);
  const before = q && q.kind === 'habit' ? (q.streak || 0) : 0;
  const res = orig.complete(id, extra);
  if (!res.ok) return res;
  if (q && q.kind === 'habit') {
    const y = shiftDay(S.today, -1);
    const doneY = (S.habitDone[y] || []).includes(q.uid);
    q.streak = doneY ? before + 1 : 1; q.best = Math.max(q.best || 0, q.streak);
  }
  if (res.prog) recordResult(S.goal, res.prog, S.goal.progress, 'Квест: ' + q.title);
  recomputeStreak(); streakReward(); checkAch(); save();
  return res;
};
addProgress = function (n, opts) {
  opts = opts || {};
  n = Number(n); if (!isFinite(n)) return { ok:false };
  const g = S.goal, before = g.progress;
  let total = opts.mode === 'set' ? n : before + n;
  total = Math.max(0, total);
  const delta = total - before;
  if (delta === 0 && opts.mode !== 'set') return { ok:false };
  g.progress = total;
  recordResult(g, delta, total, opts.note, opts.date);
  pushLog('Результат: ' + (delta > 0 ? '+' : '') + fmt(delta) + ' ' + g.metric.unit + ' → ' + fmt(total) + '.', delta >= 0 ? 'good' : 'info');
  save(); return { ok:true, delta, total };

buy = function (itemId) {

  if (S.gold < price) return { ok:false, msg:'Не хватает ' + fmt(price - S.gold) + ' золота' };

function deadlineHint(date, g) {

  if (dl < 0) return '⚠️ Дата в прошлом: ' + (-dl) + ' ' + plural(-dl,'день','дня','дней') + ' назад.';
  const target = g && g.metric ? Number(g.metric.target) : 0;
  const prog = g && typeof g.progress === 'number' ? g.progress : 0;
  const per = target > prog ? Math.round((target - prog) / Math.max(1, dl) * 10) / 10 : 0;
  return '⏳ ' + dl + ' ' + plural(dl,'день','дня','дней') + (per ? ' · нужно ' + per + ' ' + (g.metric.unit || 'ед.') + ' в день' : '');
}
function syncDeadline(kind, source) {

  const g = S ? S.goal : (obSelectedGoal() || GOALS[0]);
  if (hint) hint.textContent = deadlineHint(dateEl.value, g);
}

  switch (act) {
    case 'switch-goal': handled(); activateGoal(id); render(); toast('Цель переключена. Прогресс сохранён.', 'good'); return;
    case 'archive-goal': handled(); sheet('Завершить цель?', '<div class="card tight small">Цель будет отмечена завершённой, но прогресс, замеры, результаты и заметки останутся. Её можно выбрать в списке целей.</div>', '<button class="btn primary block" data-act="archive-goal-yes">Завершить и сохранить</button><button class="btn ghost block" style="margin-top:8px" data-act="close">Отмена</button>'); return;
    case 'archive-goal-yes': handled(); S.goal.completed = true; pushLog('Цель «' + S.goal.title + '» завершена и сохранена в архиве.', 'win'); const next = activeGoals()[0]; if (next) activateGoal(next.uid, true); save(); closeModal(); render(); toast('Цель сохранена. Можно начать новую.', 'good'); return;
    case 'add-measure': handled(); openMeasure(); return;
    case 'edit-measure': handled(); openMeasure(id); return;
    case 'del-measure': handled(); S.goal.measurements = S.goal.measurements.filter(m => m.id !== id); save(); render(); toast('Замер удалён', ''); return;
    case 'save-measure': handled(); {
      const date = document.getElementById('mDate').value || S.today;
      const values = {}; let any = false;
      S.goal.measureFields.forEach(f => { const el = document.getElementById('m_' + f.key); const v = el.value.trim(); if (v !== '') { const n = Number(v); if (isFinite(n)) { values[f.key] = n; any = true; } } });
      if (!any) { toast('Заполни хотя бы одно поле', 'bad'); return; }
      const note = document.getElementById('mNote').value.trim();
      if (id) { const m = S.goal.measurements.find(x => x.id === id); if (m) { m.date = date; m.values = values; m.note = note; } }
      else S.goal.measurements.push({ id:'m'+uid(), t:Date.now(), date, values, note });
      save(); closeModal(); render(); toast('Замер сохранён', 'good');
    } return;
    case 'measure-fields': handled(); openMeasureFields(); return;
    case 'save-measure-fields': handled(); {
      const lines = document.getElementById('mfText').value.split('\n').map(x => x.trim()).filter(Boolean);
      if (!lines.length) { toast('Добавь хотя бы одно поле', 'bad'); return; }
      const oldFields = S.goal.measureFields;
      const fields = lines.slice(0,12).map((line,i) => { const p = line.split('|'); return { key:'f'+i, label:(p[0]||'Поле').trim(), unit:(p[1]||'').trim() }; });
      S.goal.measurements.forEach(m => {
        const nv = {};
        fields.forEach(f => { const of = oldFields.find(x => x.label === f.label); if (of && m.values[of.key] != null) nv[f.key] = m.values[of.key]; });
        m.values = nv;
      });
      S.goal.measureFields = fields;
      save(); closeModal(); render(); toast('Поля замеров обновлены', 'good');
    } return;
    case 'prog-mode': handled(); window.__progMode = t.dataset.mode; t.parentNode.querySelectorAll('.pick').forEach(p => p.classList.remove('on')); t.classList.add('on'); return;
    case 'save-progress': handled(); {
      const v = Number(document.getElementById('pVal').value);
      const r = addProgress(v, { mode:window.__progMode || 'add', date:document.getElementById('pDate').value || S.today, note:document.getElementById('pNote').value.trim() });
      if (r.ok) { closeModal(); render(); toast((r.delta > 0 ? '+' : '') + fmt(r.delta) + ' ' + S.goal.metric.unit + ' · итог ' + fmt(r.total), 'good'); }
      else toast('Введи корректное число', 'bad');
    } return;
    case 'save-goal': handled(); {
      const title = document.getElementById('gTitle').value.trim();
      if (!title) { toast('Название не может быть пустым', 'bad'); return; }
      setGoalFields({ title, metricLabel:document.getElementById('gLabel').value.trim(), metricUnit:document.getElementById('gUnit').value.trim(), metricTarget:document.getElementById('gTarget').value, deadline:document.getElementById('gDeadline').value || null });
      closeModal(); render(); toast('Цель обновлена', 'good');
    } return;
    case 'add-note': handled(); openNote(); return;
    case 'edit-note': handled(); openNote(id); return;
    case 'save-note': handled(); {
      const title = document.getElementById('nTitle').value.trim(), text = document.getElementById('nText').value.trim();
      if (!text && !title) { toast('Напиши заголовок или текст', 'bad'); return; }
      const goalId = document.getElementById('nGoal').value || null;
      if (id) { const n = S.notes.find(x => x.id === id); if (n) { n.title = title; n.text = text; n.goalId = goalId; n.updatedAt = Date.now(); } }
      else S.notes.unshift({ id:'n'+uid(), title, text, goalId, pinned:false, createdAt:Date.now(), updatedAt:Date.now() });
      save(); closeModal(); render(); toast('Заметка сохранена', 'good');
    } return;
    case 'del-note': handled(); S.notes = S.notes.filter(n => n.id !== id); save(); closeModal(); render(); toast('Заметка удалена', ''); return;
    case 'pin-note': handled(); { const n = S.notes.find(x => x.id === id); if (n) n.pinned = !n.pinned; save(); render(); } return;
    case 'note-filter': handled(); window.__noteFilter = t.dataset.filter; render(); return;
    case 'buy-skin': case 'buy-bg': handled(); { const r = buy(id); if (r.ok) { toast(r.item.icon + ' Куплено: ' + r.item.title, 'gold'); render(); } else toast(r.msg, 'bad'); } return;
    case 'equip-skin': handled(); S.cosmetics.skin = id || null; if (id) { const s = SKINS.find(x => x.id === id); if (s) S.cosmetics.avatar = Object.assign(avatarCfg(), s.cfg); } save(); render(); toast(id ? 'Скин надет' : 'Скин снят', 'good'); return;
    case 'equip-bg': handled(); S.cosmetics.bg = id; applyTheme(); save(); render(); toast('Фон выбран', 'good'); return;
    case 'avatar-editor': handled(); openAvatarEditor(); return;
    case 'ava-cfg': handled(); window.__avaDraft[t.dataset.key] = t.dataset.val; t.parentNode.querySelectorAll('.color-dot').forEach(x => x.classList.remove('on')); t.classList.add('on'); refreshAvaPreview(); return;
    case 'save-avatar': handled(); S.cosmetics.avatar = window.__avaDraft; S.cosmetics.skin = null; save(); closeModal(); render(); toast('Аватар сохранён', 'good'); return;
    case 'quest-library': handled(); openQuestLibrary(); return;
    case 'lib-cat': handled(); window.__libCat = t.dataset.cat; t.parentNode.querySelectorAll('.pick').forEach(p => p.classList.remove('on')); t.classList.add('on'); filterLibrary(); return;
    case 'lib-add': handled(); {
      const title = t.dataset.title; const q = S.sidePool.concat(GENERIC_SIDE.map(T)).find(x => x.title === title);
      if (q) { addCustom({ title:q.title, desc:q.desc, cat:q.cat, diff:q.diff, minutes:q.minutes, prog:q.prog }); closeModal(); render(); toast('Квест добавлен на сегодня', 'good'); }
    } return;
    case 'buy-freeze': handled(); if (S.streakFreezes >= 3) { toast('Максимум 3 защиты', 'bad'); return; } if (S.gold < 200) { toast('Не хватает золота', 'bad'); return; } S.gold -= 200; S.streakFreezes++; pushLog('Куплена защита серии 🧊', 'shop'); save(); render(); toast('🧊 Защита серии куплена', 'gold'); return;
    case 'notif-on': handled(); requestNotif(); return;
    case 'notif-off': handled(); S.settings.notifDaily = !S.settings.notifDaily; save(); render(); toast(S.settings.notifDaily ? 'Напоминания включены' : 'Напоминания выключены', ''); return;
    case 'buy': handled(); toast('Лавка теперь продаёт скины и фоны', ''); return;
    case 'addshop': case 'save-shop': handled(); toast('Лавка теперь продаёт скины и фоны', ''); return;
  }
}, true);

document.addEventListener('input', function (e) {
  const el = e.target;
  if (el.id === 'noteSearch') { window.__noteQuery = el.value; const active = document.activeElement === el; render(); if (active) { const n = document.getElementById('noteSearch'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } } return; }
  if (el.dataset.deadline) syncDeadline(el.dataset.deadline, 'date');
  if (el.dataset.days) syncDeadline(el.dataset.days, 'days');
  if (el.dataset.ava && window.__avaDraft) { window.__avaDraft[el.dataset.ava] = el.value; refreshAvaPreview(); }
});
document.addEventListener('change', function (e) {
  const el = e.target, c = el.dataset.change;
  if (!c || !S) return;
  if (c === 'notif-time') { S.settings.notifTime = el.value || '20:00'; save(); toast('Время напоминания сохранено', 'good'); }
  if (c === 'notif-streak') { S.settings.notifStreak = el.checked; save(); }
  if (c === 'notif-deadline') { S.settings.notifDeadline = el.checked; save(); }
  if (c === 'notif-focus') { S.settings.notifFocus = el.checked; save(); }
  if (el.dataset.ava && window.__avaDraft) { window.__avaDraft[el.dataset.ava] = el.value; refreshAvaPreview(); }
});
function filterLibrary() {
  const cat = window.__libCat || '';
  document.querySelectorAll('#libList .quest').forEach(card => {
    const btn = card.querySelector('[data-act="lib-add"]');
    const title = btn ? btn.dataset.title : '';
    const q = S.sidePool.concat(GENERIC_SIDE.map(T)).find(x => x.title === title);
    card.style.display = !cat || (q && q.cat === cat) ? '' : 'none';
  });
}

/* ---------- патч онбординга: несколько целей ---------- */
const origRenderOB = renderOB;
renderOB = function () {
  origRenderOB();
  if (!OB) return;
  if (OB.step === 1) {
    const h = document.querySelector('#app .screen h2');
    if (h && h.textContent === 'Главная цель') {
      h.textContent = 'Первая цель';
      const sub = h.nextElementSibling; if (sub) sub.textContent = 'Можно вести несколько целей одновременно. Позже добавишь финансы, тренировки и спокойствие.';
    }
  }
  if (OB.step === 2 && !OB.forNew) {
    const dl = document.getElementById('obDeadline');
    if (dl && !dl.dataset.deadline) {
      dl.dataset.deadline = 'ob';
      const field = dl.closest('.field');
      const row = document.createElement('div'); row.className = 'row';
      field.parentNode.insertBefore(row, field);
      row.appendChild(field);
      const daysField = document.createElement('div'); daysField.className = 'field grow';
      daysField.innerHTML = '<label>Дней осталось</label><input id="obDays" type="number" min="0" data-days="ob">';
      row.appendChild(daysField);
      const hint = document.createElement('div'); hint.className = 'hint'; hint.id = 'obDeadlineHint';
      row.parentNode.insertBefore(hint, row.nextSibling);
      syncDeadline('ob', 'date');
    }
  }
};

/* ---------- таймеры ---------- */
setInterval(function () { if (S) { checkReminders(); } }, 30000);
window.addEventListener('focus', function () { if (S) checkReminders(); });
window.LifeRPGv2 = { normalize, activateGoal, avatarSVG, SKINS, BGS, recomputeStreak, checkReminders };
})();

</script>

/* PWA: офлайн-кэш включается только когда приложение открыто по http(s) */
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (!/^https?:$/.test(location.protocol)) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
})();
