<style>
/* ================= LIFE RPG — интерфейс ================= */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: #070a12;
  color: #e8ecf8;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px; line-height: 1.45;
  overscroll-behavior-y: none;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(124,92,255,.22), transparent 60%),
    radial-gradient(700px 460px at 100% 8%, rgba(0,224,184,.14), transparent 60%),
    radial-gradient(600px 500px at 50% 110%, rgba(255,92,122,.10), transparent 60%);
}
#app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100%; padding-bottom: 92px; }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 15px; }
::-webkit-scrollbar { width: 0; height: 0; }

/* ---------- HUD ---------- */
.hud {
  position: sticky; top: 0; z-index: 30;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
  background: linear-gradient(180deg, rgba(7,10,18,.96) 60%, rgba(7,10,18,.75));
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.hud-row { display: flex; align-items: center; gap: 10px; }
.hud-ava {
  width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 22px;
  background: linear-gradient(145deg, #2a2350, #17203a); border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 4px 14px rgba(124,92,255,.25); flex: none;
}
.hud-id { flex: 1; min-width: 0; }
.hud-name { font-weight: 700; font-size: 15px; letter-spacing: .2px; display: flex; align-items: center; gap: 6px; }
.hud-rank { font-size: 11.5px; color: #8d97b5; }
.lvl {
  font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px;
  background: linear-gradient(135deg, #7c5cff, #b06cff); color: #fff; letter-spacing: .3px;
}
.streak-chip { font-size: 12px; font-weight: 700; color: #ffb35c; background: rgba(255,140,60,.12); border: 1px solid rgba(255,140,60,.25); padding: 3px 8px; border-radius: 999px; }
.xp-line { margin-top: 8px; }
.bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; transition: width .45s cubic-bezier(.4,1.4,.5,1); }
.bar.xp > i { background: linear-gradient(90deg, #7c5cff, #c86cff); box-shadow: 0 0 12px rgba(160,110,255,.6); }
.bar.hp > i { background: linear-gradient(90deg, #ff4d6d, #ff8a5c); box-shadow: 0 0 12px rgba(255,90,120,.5); }
.bar.en > i { background: linear-gradient(90deg, #22b8ff, #4ff0d0); box-shadow: 0 0 12px rgba(60,200,255,.45); }
.bar.goal > i { background: linear-gradient(90deg, #00e0b8, #7c5cff); box-shadow: 0 0 12px rgba(0,224,184,.45); }
.bar.tiny { height: 5px; }
.hud-stats { display: flex; gap: 7px; margin-top: 9px; }
.chip {
  flex: 1; display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 12px;
  background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.07); font-size: 12px; font-weight: 700;
}
.chip span.v { margin-left: auto; font-variant-numeric: tabular-nums; color: #cfd6ee; font-weight: 600; }
.chip.hp { color: #ff8098; } .chip.en { color: #56d8ff; } .chip.gold { color: #ffcc4d; }

/* ---------- секции и карточки ---------- */
.screen { padding: 14px 14px 10px; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.sec-title { display: flex; align-items: center; gap: 8px; margin: 18px 2px 9px; font-size: 12px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; color: #7f89a8; }
.sec-title:first-child { margin-top: 2px; }
.sec-title .count { margin-left: auto; font-size: 11px; color: #6c769a; letter-spacing: .4px; }
.card {
  background: linear-gradient(160deg, rgba(30,38,60,.85), rgba(17,22,38,.9));
  border: 1px solid rgba(255,255,255,.075); border-radius: 18px; padding: 14px;
  box-shadow: 0 6px 22px rgba(0,0,0,.28); margin-bottom: 10px;
}
.card.tight { padding: 12px; }
.muted { color: #8d97b5; }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; }
h1, h2, h3 { margin: 0; font-weight: 800; }
h2 { font-size: 18px; } h3 { font-size: 15px; }

/* ---------- квесты ---------- */
.quest { display: flex; gap: 11px; align-items: flex-start; position: relative; overflow: hidden; }
.quest::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c, #7c5cff); opacity: .85; }
.quest.story { border-color: rgba(124,92,255,.45); box-shadow: 0 6px 26px rgba(124,92,255,.18); }
.quest.boss { border-color: rgba(255,90,120,.5); background: linear-gradient(160deg, rgba(60,26,40,.9), rgba(24,18,32,.92)); box-shadow: 0 6px 26px rgba(255,70,110,.2); }
.quest.boss::before { background: linear-gradient(180deg, #ff4d6d, #ffb35c); }
.quest.done { opacity: .5; }
.q-check {
  width: 30px; height: 30px; flex: none; border-radius: 10px; margin-top: 2px;
  border: 2px solid rgba(255,255,255,.22); display: grid; place-items: center; font-size: 15px; color: transparent;
  transition: transform .15s, background .2s, border-color .2s;
}
.q-check:active { transform: scale(.9); }
.q-check.on { background: linear-gradient(135deg, #00e0b8, #22b8ff); border-color: transparent; color: #05202a; font-weight: 900; }
.q-title { font-weight: 700; font-size: 14.5px; line-height: 1.3; }
.q-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.tag { font-size: 10.5px; font-weight: 700; padding: 2.5px 7px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); color: #b9c2dd; letter-spacing: .2px; }
.tag.xp { color: #c4a6ff; border-color: rgba(160,110,255,.3); background: rgba(124,92,255,.12); }
.tag.gold { color: #ffd166; border-color: rgba(255,204,77,.28); background: rgba(255,204,77,.1); }
.tag.en { color: #6fdcff; border-color: rgba(60,200,255,.25); background: rgba(60,200,255,.1); }
.tag.prog { color: #6ff0cf; border-color: rgba(0,224,184,.28); background: rgba(0,224,184,.1); }
.tag.boss { color: #ff9db0; border-color: rgba(255,90,120,.35); background: rgba(255,90,120,.14); }
.q-open { flex: 1; min-width: 0; text-align: left; }
.habit-streak { font-size: 11px; color: #ffb35c; font-weight: 700; }

/* ---------- кнопки ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 15px; border-radius: 14px; font-weight: 700; font-size: 14px;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); transition: transform .12s, filter .2s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(135deg, #7c5cff, #b06cff); border-color: transparent; color: #fff; box-shadow: 0 6px 18px rgba(124,92,255,.32); }
.btn.good { background: linear-gradient(135deg, #00d3a7, #22b8ff); border-color: transparent; color: #04222b; box-shadow: 0 6px 18px rgba(0,211,167,.28); }
.btn.gold { background: linear-gradient(135deg, #ffb347, #ffd76f); border-color: transparent; color: #2b1d00; }
.btn.danger { background: rgba(255,77,109,.14); border-color: rgba(255,77,109,.35); color: #ff9db0; }
.btn.ghost { background: rgba(255,255,255,.04); }
.btn.block { width: 100%; }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.fab-add { width: 100%; padding: 12px; border-radius: 16px; border: 1px dashed rgba(255,255,255,.22); color: #9aa4c4; font-weight: 700; background: rgba(255,255,255,.02); }

/* ---------- атрибуты ---------- */
.attrs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.attr { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 15px; padding: 11px; }
.attr .n { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: #aab3d0; font-weight: 700; }
.attr .v { font-size: 22px; font-weight: 800; margin-top: 3px; font-variant-numeric: tabular-nums; }
.attr .p { font-size: 10.5px; color: #79839f; margin-top: 2px; line-height: 1.3; }

/* ---------- герой ---------- */
.hero-card { text-align: center; padding: 20px 16px; background: linear-gradient(165deg, rgba(46,36,86,.9), rgba(16,21,38,.92)); }
.hero-ava { font-size: 54px; line-height: 1; filter: drop-shadow(0 6px 16px rgba(124,92,255,.45)); }
.hero-name { font-size: 20px; font-weight: 800; margin-top: 8px; }
.hero-rank { color: #9aa4c4; font-size: 12.5px; letter-spacing: .4px; }
.stat-row { margin-top: 12px; }
.stat-row .spread { font-size: 12.5px; margin-bottom: 5px; font-weight: 700; }
.effects { display: flex; flex-wrap: wrap; gap: 7px; }
.effect { font-size: 11.5px; font-weight: 700; padding: 5px 9px; border-radius: 11px; border: 1px solid; }
.effect.buff { color: #6ff0cf; border-color: rgba(0,224,184,.3); background: rgba(0,224,184,.1); }
.effect.debuff { color: #ff9db0; border-color: rgba(255,90,120,.3); background: rgba(255,90,120,.1); }
.effect.neutral { color: #b9c2dd; border-color: rgba(255,255,255,.12); background: rgba(255,255,255,.05); }
.ach-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ach { aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center; font-size: 21px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); position: relative; }
.ach.off { filter: grayscale(1); opacity: .3; }
.ach.on { background: linear-gradient(145deg, rgba(255,204,77,.18), rgba(124,92,255,.14)); border-color: rgba(255,204,77,.3); }

/* ---------- цель ---------- */
.goal-card { background: linear-gradient(165deg, rgba(20,52,58,.9), rgba(16,21,38,.94)); border-color: rgba(0,224,184,.22); }
.goal-emoji { font-size: 30px; }
.goal-num { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.chapter { border-left: 2px solid rgba(255,255,255,.1); margin-left: 8px; padding: 0 0 4px 16px; position: relative; }
.chapter.active { border-left-color: rgba(124,92,255,.6); }
.chapter-dot { position: absolute; left: -8px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #1a2138; border: 2px solid rgba(255,255,255,.2); }
.chapter.active .chapter-dot { background: #7c5cff; border-color: #b06cff; box-shadow: 0 0 12px rgba(124,92,255,.7); }
.chapter.done .chapter-dot { background: #00e0b8; border-color: #00e0b8; }
.step { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 5px 0; color: #aab3d0; }
.step.done { color: #6ff0cf; }
.step.now { color: #fff; font-weight: 700; }
.step.lock { opacity: .45; }
.step .ic { flex: none; width: 16px; text-align: center; }

/* ---------- лавка ---------- */
.shop-item { display: flex; gap: 11px; align-items: center; }
.shop-ic { width: 42px; height: 42px; flex: none; border-radius: 13px; display: grid; place-items: center; font-size: 21px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); }
.price { font-weight: 800; color: #ffd166; font-size: 13.5px; white-space: nowrap; }

/* ---------- журнал ---------- */
.chart { display: flex; align-items: flex-end; gap: 6px; height: 96px; margin-top: 6px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
.chart .b { width: 100%; border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, #a06cff, #7c5cff); min-height: 3px; box-shadow: 0 0 10px rgba(124,92,255,.35); }
.chart .b.zero { background: rgba(255,255,255,.08); box-shadow: none; }
.chart .d { font-size: 10px; color: #79839f; }
.log-item { display: flex; gap: 9px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; }
.log-item:last-child { border-bottom: none; }
.log-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex: none; background: #7c5cff; }
.log-item.good .log-dot { background: #00e0b8; } .log-item.bad .log-dot { background: #ff4d6d; }
.log-item.win .log-dot { background: #ffd166; } .log-item.boss .log-dot { background: #ff8a5c; }
.log-item.story .log-dot { background: #b06cff; } .log-item.day .log-dot { background: #56d8ff; }
.log-time { font-size: 10.5px; color: #6c769a; margin-top: 2px; }
.kpi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.kpi div { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 14px; padding: 11px; }
.kpi b { display: block; font-size: 20px; font-weight: 800; }
.kpi span { font-size: 11.5px; color: #8d97b5; }

/* ---------- нижняя навигация ---------- */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; max-width: 480px; margin: 0 auto;
  display: flex; padding: 8px 6px calc(env(safe-area-inset-bottom, 0px) + 8px);
  background: rgba(10,14,24,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255,255,255,.07);
}
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 0; border-radius: 12px; color: #6c769a; font-size: 10px; font-weight: 700; letter-spacing: .2px; position: relative; }
.nav button .ic { font-size: 19px; filter: grayscale(.6); transition: transform .18s, filter .2s; }
.nav button.on { color: #d8dcf0; }
.nav button.on .ic { filter: none; transform: translateY(-1px) scale(1.1); }
.nav .badge { position: absolute; top: 2px; right: 50%; margin-right: -20px; min-width: 16px; height: 16px; border-radius: 999px; background: #ff4d6d; color: #fff; font-size: 9.5px; display: grid; place-items: center; padding: 0 4px; font-weight: 800; }

/* ---------- модальные окна ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(4,6,12,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade .2s ease;
}
.sheet {
  width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
  background: linear-gradient(180deg, #161d31, #0d1220); border-radius: 24px 24px 0 0;
  border: 1px solid rgba(255,255,255,.1); border-bottom: none;
  padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
  animation: up .28s cubic-bezier(.2,1,.3,1);
}
@keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-handle { width: 40px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.18); margin: 0 auto 14px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: #7f89a8; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 12px; border-radius: 13px; background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.12); color: #e8ecf8; outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: rgba(124,92,255,.6); background: rgba(124,92,255,.08); }
.field .hint { font-size: 11px; color: #6c769a; margin-top: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.pick {
  padding: 9px 12px; border-radius: 13px; background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1); font-size: 13px; font-weight: 700; color: #b9c2dd;
}
.pick.on { background: linear-gradient(135deg, rgba(124,92,255,.3), rgba(0,224,184,.2)); border-color: rgba(124,92,255,.6); color: #fff; }
.ava-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.ava-pick { aspect-ratio: 1; border-radius: 14px; font-size: 22px; display: grid; place-items: center; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
.ava-pick.on { background: linear-gradient(145deg, #2a2350, #17203a); border-color: rgba(124,92,255,.7); box-shadow: 0 0 14px rgba(124,92,255,.35); }
.goal-pick { display: flex; gap: 11px; align-items: center; width: 100%; text-align: left; padding: 12px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); margin-bottom: 8px; }
.goal-pick.on { border-color: rgba(0,224,184,.55); background: linear-gradient(135deg, rgba(0,224,184,.12), rgba(124,92,255,.12)); }
.goal-pick .e { font-size: 24px; }
.dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
.dots i { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,.18); }
.dots i.on { background: #7c5cff; width: 20px; }

/* ---------- тосты и левелап ---------- */
.toasts { position: fixed; left: 0; right: 0; bottom: 88px; z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 7px; pointer-events: none; padding: 0 14px; }
.toasts.top { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 14px); }
.q-check svg { display: block; }
.step .ic svg { display: inline-block; vertical-align: -1px; }
.toast {
  max-width: 440px; padding: 10px 14px; border-radius: 14px; font-size: 13px; font-weight: 700;
  background: rgba(22,29,49,.97); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 8px 26px rgba(0,0,0,.45);
  animation: toastIn .25s ease; display: flex; gap: 8px; align-items: center;
}
.toast.good { border-color: rgba(0,224,184,.45); color: #8ff5dd; }
.toast.bad { border-color: rgba(255,77,109,.45); color: #ffadbb; }
.toast.gold { border-color: rgba(255,204,77,.45); color: #ffdf94; }
@keyframes toastIn { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.levelup { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(4,6,12,.8); animation: fade .25s; }
.levelup .inner { text-align: center; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.levelup .big { font-size: 64px; }
.levelup .t { font-size: 26px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(135deg, #ffd166, #ff8a5c, #b06cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.spark { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: fall 1.6s linear forwards; }
@keyframes fall { to { transform: translateY(90vh) rotate(540deg); opacity: 0; } }
.focus-ring { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
.pulse { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
.empty { text-align: center; padding: 26px 14px; color: #79839f; font-size: 13px; }
.empty .e { font-size: 34px; display: block; margin-bottom: 8px; }
/* ================= LIFE RPG v2 ================= */
.goal-switch { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:4px; }
.goal-tab { flex:0 0 auto; min-width:132px; max-width:190px; text-align:left; padding:9px 11px; border-radius:14px; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.09); color:#b9c2dd; font-size:12px; font-weight:700; }
.goal-tab span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px; }
.goal-tab i { display:block; font-style:normal; font-size:10.5px; color:#79839f; margin-top:4px; }
.goal-tab.on { border-color:rgba(0,224,184,.55); background:linear-gradient(135deg,rgba(0,224,184,.13),rgba(124,92,255,.13)); color:#fff; }
.goal-tab.done { opacity:.75; }
.goal-tab.add { display:grid; place-items:center; min-width:104px; border-style:dashed; color:#9aa4c4; }
.measure-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.measure-cell { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:9px; }
.measure-cell span { display:block; font-size:10.5px; color:#8d97b5; font-weight:700; letter-spacing:.3px; }
.measure-cell b { display:block; font-size:14px; margin-top:3px; font-variant-numeric:tabular-nums; }
.measure-cell i { display:block; font-style:normal; font-size:10.5px; color:#6ff0cf; margin-top:2px; }
.streak-week { display:flex; gap:6px; margin:10px 0; }
.streak-day { flex:1; text-align:center; padding:7px 2px; border-radius:11px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); }
.streak-day span { display:block; font-size:16px; }
.streak-day i { display:block; font-style:normal; font-size:10px; color:#79839f; margin-top:2px; }
.streak-day.on { background:rgba(255,140,60,.13); border-color:rgba(255,140,60,.35); }
.streak-day.ice { background:rgba(86,216,255,.13); border-color:rgba(86,216,255,.35); }
.color-dot { width:30px; height:30px; border-radius:50%; border:2px solid rgba(255,255,255,.25); padding:0; }
.color-dot.on { border-color:#fff; box-shadow:0 0 0 3px rgba(124,92,255,.55); }
.check-row { display:flex; align-items:center; gap:8px; font-size:13px; color:#b9c2dd; padding:6px 0; }
.check-row input { width:auto; accent-color:#7c5cff; }
.note-card { border-left:3px solid rgba(124,92,255,.6); }
.nav button { font-size:9.5px; }
.nav button .ic { font-size:18px; }
#libList .quest { align-items:center; }
.field textarea { resize:vertical; min-height:44px; }
.hint { font-size:11px; color:#6c769a; margin-top:5px; }

/* фоны */
body[data-bg]::before { background:none; }
body[data-bg="bg-purple"]::before { background:radial-gradient(900px 500px at 12% -8%, rgba(124,92,255,.28), transparent 60%), radial-gradient(700px 460px at 100% 8%, rgba(0,224,184,.12), transparent 60%), radial-gradient(600px 500px at 50% 110%, rgba(255,92,122,.10), transparent 60%); }
body[data-bg="bg-black"] { color:#e8ecf8; }
body[data-bg="bg-white"] { color:#171a24; }

/* светлая тема */
body.light { color:#171a24; }
body.light .muted, body.light .tiny.muted { color:#5d6478; }
body.light .card { background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(244,245,251,.96)); border-color:rgba(20,24,40,.09); box-shadow:0 6px 22px rgba(20,24,40,.08); color:#171a24; }
body.light .card.tight { color:#171a24; }
body.light .hud { background:linear-gradient(180deg,rgba(244,245,251,.97) 60%,rgba(244,245,251,.8)); border-bottom-color:rgba(20,24,40,.08); }
body.light .hud-rank, body.light .chip span.v { color:#5d6478; }
body.light .chip { background:rgba(20,24,40,.045); border-color:rgba(20,24,40,.08); }
body.light .nav { background:rgba(244,245,251,.95); border-top-color:rgba(20,24,40,.08); }
body.light .nav button { color:#7a8199; }
body.light .nav button.on { color:#171a24; }
body.light .sheet { background:linear-gradient(180deg,#ffffff,#f2f3fa); border-color:rgba(20,24,40,.1); color:#171a24; }
body.light .field input, body.light .field select, body.light .field textarea { background:rgba(20,24,40,.04); border-color:rgba(20,24,40,.13); color:#171a24; }
body.light .field label, body.light .sec-title { color:#5d6478; }
body.light .btn.ghost { background:rgba(20,24,40,.05); border-color:rgba(20,24,40,.1); color:#171a24; }
body.light .fab-add { border-color:rgba(20,24,40,.2); color:#5d6478; background:rgba(20,24,40,.02); }
body.light .pick { background:rgba(20,24,40,.05); border-color:rgba(20,24,40,.1); color:#3c4257; }
body.light .pick.on { color:#fff; }
body.light .tag { background:rgba(20,24,40,.05); border-color:rgba(20,24,40,.09); color:#3c4257; }
body.light .goal-tab { background:rgba(20,24,40,.045); border-color:rgba(20,24,40,.09); color:#3c4257; }
body.light .goal-tab.on { color:#171a24; }
body.light .measure-cell, body.light .streak-day, body.light .attr, body.light .kpi div { background:rgba(20,24,40,.04); border-color:rgba(20,24,40,.08); }
body.light .measure-cell span, body.light .streak-day i, body.light .attr .p, body.light .kpi span { color:#5d6478; }
body.light .bar { background:rgba(20,24,40,.09); }
body.light .log-item { border-bottom-color:rgba(20,24,40,.07); }
body.light .log-time, body.light .chart .d { color:#7a8199; }
body.light .step { color:#3c4257; }
body.light .step.now { color:#171a24; }
body.light .chapter { border-left-color:rgba(20,24,40,.12); }
body.light .chapter-dot { background:#e6e8f2; border-color:rgba(20,24,40,.2); }
body.light .q-check { border-color:rgba(20,24,40,.25); }
body.light .shop-ic, body.light .ava-pick, body.light .ach { background:rgba(20,24,40,.05); border-color:rgba(20,24,40,.09); }
body.light .goal-pick { background:rgba(20,24,40,.04); border-color:rgba(20,24,40,.09); color:#171a24; }
body.light .check-row { color:#3c4257; }
body.light .hint { color:#7a8199; }
body.light .empty { color:#7a8199; }
body.light .toast { background:rgba(255,255,255,.98); color:#171a24; border-color:rgba(20,24,40,.14); }
body.light .overlay { background:rgba(20,24,40,.35); }
body.light .color-dot.on { border-color:#171a24; }
body.light .hero-card { background:linear-gradient(165deg,rgba(237,233,255,.95),rgba(255,255,255,.96)); }
body.light .goal-card { background:linear-gradient(165deg,rgba(224,247,242,.95),rgba(255,255,255,.96)); }
body.light .quest.boss { background:linear-gradient(160deg,rgba(255,235,240,.95),rgba(255,255,255,.96)); }
body.light .levelup { background:rgba(244,245,251,.85); }
body.light .streak-chip { color:#b25e13; }

@media (max-width:380px) {
  .nav button { font-size:8.5px; }
  .nav button .ic { font-size:16px; }
  .measure-grid { grid-template-columns:1fr; }
}

/* ================= LIFE RPG — CYBER / RPG SKIN ================= */
:root {
  --cy-bg: #04060d;
  --cy-panel: rgba(8, 14, 28, .92);
  --cy-panel-2: rgba(12, 20, 38, .94);
  --cy-line: rgba(0, 224, 255, .18);
  --cy-line-strong: rgba(0, 224, 255, .45);
  --cy-cyan: #00e0ff;
  --cy-magenta: #ff4dd8;
  --cy-violet: #8b5cff;
  --cy-green: #00e0b8;
  --cy-amber: #ffd166;
  --cy-red: #ff4d6d;
  --cy-text: #e6f7ff;
  --cy-dim: #7f9bb8;
}

body.cyber {
  background: var(--cy-bg);
  color: var(--cy-text);
  font-feature-settings: "tnum";
}
body.cyber::before {
  background:
    linear-gradient(rgba(0, 224, 255, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 224, 255, .035) 1px, transparent 1px),
    radial-gradient(900px 520px at 10% -10%, rgba(0, 224, 255, .14), transparent 60%),
    radial-gradient(760px 480px at 100% 0%, rgba(255, 77, 216, .10), transparent 60%),
    radial-gradient(700px 520px at 50% 115%, rgba(139, 92, 255, .12), transparent 60%);
  background-size: 30px 30px, 30px 30px, auto, auto, auto;
}
body.cyber[data-bg="bg-purple"]::before {
  background:
    linear-gradient(rgba(0, 224, 255, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 224, 255, .035) 1px, transparent 1px),
    radial-gradient(900px 520px at 10% -10%, rgba(139, 92, 255, .22), transparent 60%),
    radial-gradient(760px 480px at 100% 0%, rgba(0, 224, 255, .12), transparent 60%),
    radial-gradient(700px 520px at 50% 115%, rgba(255, 77, 216, .10), transparent 60%);
  background-size: 30px 30px, 30px 30px, auto, auto, auto;
}
body.cyber::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
  mix-blend-mode: overlay;
}
body.cyber #app { z-index: 1; }

/* ---------- HUD ---------- */
body.cyber .hud {
  background: linear-gradient(180deg, rgba(4, 8, 18, .97) 55%, rgba(4, 8, 18, .82));
  border-bottom: 1px solid var(--cy-line-strong);
  box-shadow: 0 10px 34px rgba(0, 0, 0, .45), 0 0 26px rgba(0, 224, 255, .10);
}
body.cyber .hud-ava {
  border-radius: 12px;
  border: 1px solid var(--cy-line-strong);
  background: radial-gradient(circle at 30% 25%, rgba(0,224,255,.22), rgba(10,16,32,.95) 70%);
  box-shadow: 0 0 18px rgba(0, 224, 255, .30), inset 0 0 12px rgba(0, 224, 255, .12);
}
body.cyber .hud-name { letter-spacing: .4px; }
body.cyber .hud-rank { color: var(--cy-dim); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
body.cyber .hud-rank::before { content: '◈ '; color: var(--cy-cyan); }
body.cyber .lvl {
  background: linear-gradient(135deg, var(--cy-cyan), var(--cy-violet));
  box-shadow: 0 0 14px rgba(0, 224, 255, .45);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  border-radius: 7px;
}
body.cyber .streak-chip {
  border-color: rgba(255, 140, 60, .55);
  box-shadow: 0 0 14px rgba(255, 140, 60, .22);
  border-radius: 8px;
}
body.cyber .bar {
  background: rgba(0, 224, 255, .07);
  border: 1px solid rgba(0, 224, 255, .12);
  border-radius: 6px;
}
body.cyber .bar > i { border-radius: 5px; }
body.cyber .bar.xp > i { background: linear-gradient(90deg, var(--cy-cyan), var(--cy-violet)); box-shadow: 0 0 14px rgba(0, 224, 255, .65); }
body.cyber .bar.hp > i { background: linear-gradient(90deg, var(--cy-red), #ff8a5c); box-shadow: 0 0 14px rgba(255, 77, 109, .55); }
body.cyber .bar.en > i { background: linear-gradient(90deg, #22b8ff, var(--cy-green)); box-shadow: 0 0 14px rgba(34, 184, 255, .55); }
body.cyber .bar.goal > i { background: linear-gradient(90deg, var(--cy-green), var(--cy-cyan)); box-shadow: 0 0 14px rgba(0, 224, 184, .55); }
body.cyber .chip {
  background: rgba(0, 224, 255, .05);
  border: 1px solid rgba(0, 224, 255, .16);
  border-radius: 9px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
body.cyber .chip span.v { color: var(--cy-text); }

/* ---------- sections / cards ---------- */
body.cyber .sec-title {
  color: #86f4ff;
  letter-spacing: 1.6px;
  text-shadow: 0 0 10px rgba(0, 224, 255, .30);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
body.cyber .sec-title::before { content: '// '; color: var(--cy-magenta); opacity: .85; }
body.cyber .card {
  position: relative;
  background: linear-gradient(160deg, var(--cy-panel-2), var(--cy-panel));
  border: 1px solid var(--cy-line);
  border-radius: 14px;
  box-shadow: 0 8px 26px rgba(0, 0, 0, .38), inset 0 0 0 1px rgba(255, 255, 255, .02);
}
body.cyber .card:not(.quest)::after {
  content: ''; position: absolute; top: -1px; right: -1px; width: 18px; height: 18px;
  border-top: 2px solid var(--cy-line-strong); border-right: 2px solid var(--cy-line-strong);
  border-radius: 0 14px 0 0; opacity: .65; pointer-events: none;
}
body.cyber .card.tight { border-radius: 12px; }
body.cyber .goal-card { border-color: rgba(0, 224, 184, .35); box-shadow: 0 8px 26px rgba(0,0,0,.38), 0 0 22px rgba(0,224,184,.10); }
body.cyber .hero-card { border-color: rgba(139, 92, 255, .4); box-shadow: 0 8px 26px rgba(0,0,0,.38), 0 0 26px rgba(139,92,255,.14); }
body.cyber .hero-ava svg { filter: drop-shadow(0 0 14px rgba(0, 224, 255, .35)); }
body.cyber .hero-name { letter-spacing: .4px; }
body.cyber .hero-rank { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

/* ---------- quests ---------- */
body.cyber .quest { border-color: rgba(0, 224, 255, .14); }
body.cyber .quest::before { width: 3px; box-shadow: 0 0 12px currentColor; }
body.cyber .quest.story { border-color: rgba(139, 92, 255, .5); box-shadow: 0 8px 26px rgba(0,0,0,.38), 0 0 22px rgba(139,92,255,.18); }
body.cyber .quest.boss { border-color: rgba(255, 77, 109, .6); box-shadow: 0 8px 26px rgba(0,0,0,.38), 0 0 26px rgba(255,77,109,.24); }
body.cyber .q-check {
  border-radius: 8px;
  border-color: rgba(0, 224, 255, .4);
  background: rgba(0, 224, 255, .04);
}
body.cyber .q-check.on {
  background: linear-gradient(135deg, var(--cy-cyan), var(--cy-green));
  box-shadow: 0 0 16px rgba(0, 224, 255, .55);
  color: #03151c;
}
body.cyber .q-title { letter-spacing: .2px; }
body.cyber .tag {
  border-radius: 6px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: .4px;
}
body.cyber .habit-streak { text-shadow: 0 0 10px rgba(255, 140, 60, .4); }

/* ---------- buttons ---------- */
body.cyber .btn {
  border-radius: 10px;
  letter-spacing: .4px;
  font-weight: 800;
  border: 1px solid rgba(0, 224, 255, .18);
  transition: transform .12s, box-shadow .2s, filter .2s;
}
body.cyber .btn.primary {
  background: linear-gradient(135deg, #00c8ff, var(--cy-violet));
  box-shadow: 0 0 20px rgba(0, 200, 255, .32);
  border-color: transparent;
}
body.cyber .btn.good {
  background: linear-gradient(135deg, var(--cy-green), #00a3ff);
  box-shadow: 0 0 20px rgba(0, 224, 184, .28);
  border-color: transparent;
}
body.cyber .btn.gold {
  background: linear-gradient(135deg, var(--cy-amber), #ff8a5c);
  box-shadow: 0 0 20px rgba(255, 209, 102, .26);
  border-color: transparent;
}
body.cyber .btn.danger {
  background: rgba(255, 77, 109, .12);
  border-color: rgba(255, 77, 109, .45);
  box-shadow: 0 0 16px rgba(255, 77, 109, .12);
}
body.cyber .btn.ghost {
  background: rgba(0, 224, 255, .05);
  border-color: rgba(0, 224, 255, .24);
  color: #a8f0ff;
}
body.cyber .btn:hover { filter: brightness(1.06); }
body.cyber .fab-add {
  border-radius: 12px;
  border: 1px dashed rgba(0, 224, 255, .35);
  color: #86f4ff;
  background: rgba(0, 224, 255, .03);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* ---------- nav ---------- */
body.cyber .nav {
  background: rgba(3, 6, 13, .97);
  border-top: 1px solid var(--cy-line-strong);
  box-shadow: 0 -10px 34px rgba(0, 0, 0, .5), 0 0 26px rgba(0, 224, 255, .10);
}
body.cyber .nav button { color: #5f7d9c; border-radius: 10px; }
body.cyber .nav button.on { color: #86f4ff; }
body.cyber .nav button.on .ic { filter: none; transform: translateY(-2px) scale(1.12); text-shadow: 0 0 14px rgba(0, 224, 255, .8); }
body.cyber .nav button.on::after {
  content: ''; position: absolute; bottom: 2px; left: 26%; right: 26%; height: 2px;
  background: linear-gradient(90deg, var(--cy-cyan), var(--cy-magenta));
  box-shadow: 0 0 10px var(--cy-cyan); border-radius: 2px;
}
body.cyber .nav .badge { background: var(--cy-magenta); box-shadow: 0 0 10px rgba(255, 77, 216, .6); }

/* ---------- forms / sheets ---------- */
body.cyber .field label {
  color: #86f4ff;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: .8px;
}
body.cyber .field input, body.cyber .field select, body.cyber .field textarea {
  background: rgba(0, 224, 255, .045);
  border: 1px solid rgba(0, 224, 255, .22);
  border-radius: 10px;
  color: var(--cy-text);
}
body.cyber .field input:focus, body.cyber .field select:focus, body.cyber .field textarea:focus {
  border-color: var(--cy-cyan);
  box-shadow: 0 0 0 3px rgba(0, 224, 255, .12), 0 0 18px rgba(0, 224, 255, .18);
  background: rgba(0, 224, 255, .07);
}
body.cyber .pick {
  border-radius: 9px;
  border-color: rgba(0, 224, 255, .2);
  background: rgba(0, 224, 255, .05);
  color: #a8f0ff;
}
body.cyber .pick.on {
  background: linear-gradient(135deg, rgba(0, 224, 255, .22), rgba(139, 92, 255, .22));
  border-color: var(--cy-cyan);
  box-shadow: 0 0 14px rgba(0, 224, 255, .22);
  color: #fff;
}
body.cyber .overlay { background: rgba(2, 4, 10, .78); }
body.cyber .sheet {
  background: linear-gradient(180deg, #0a1224, #05080f);
  border: 1px solid var(--cy-line-strong);
  border-bottom: none;
  border-radius: 18px 18px 0 0;
  box-shadow: 0 -12px 44px rgba(0, 224, 255, .14);
}
body.cyber .sheet-handle { background: linear-gradient(90deg, var(--cy-cyan), var(--cy-magenta)); box-shadow: 0 0 10px rgba(0,224,255,.5); }
body.cyber .hint { color: var(--cy-dim); }

/* ---------- goal switch / measures / streak ---------- */
body.cyber .goal-tab {
  border-radius: 10px;
  background: rgba(0, 224, 255, .045);
  border-color: rgba(0, 224, 255, .18);
  color: #a8f0ff;
}
body.cyber .goal-tab.on {
  border-color: var(--cy-cyan);
  background: linear-gradient(135deg, rgba(0, 224, 255, .14), rgba(139, 92, 255, .14));
  box-shadow: 0 0 18px rgba(0, 224, 255, .22);
  color: #fff;
}
body.cyber .goal-tab.add { border-color: rgba(0, 224, 255, .35); color: #86f4ff; }
body.cyber .measure-cell {
  background: rgba(0, 224, 255, .05);
  border: 1px solid rgba(0, 224, 255, .16);
  border-radius: 10px;
}
body.cyber .measure-cell span { color: var(--cy-dim); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
body.cyber .measure-cell b { color: var(--cy-text); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
body.cyber .measure-cell i { color: #86f4ff; }
body.cyber .streak-day { border-radius: 9px; background: rgba(0, 224, 255, .045); border-color: rgba(0, 224, 255, .14); }
body.cyber .streak-day.on { background: rgba(255, 140, 60, .14); border-color: rgba(255, 140, 60, .55); box-shadow: 0 0 14px rgba(255, 140, 60, .22); }
body.cyber .streak-day.ice { background: rgba(0, 224, 255, .12); border-color: rgba(0, 224, 255, .5); box-shadow: 0 0 14px rgba(0, 224, 255, .2); }

/* ---------- shop / attrs / log ---------- */
body.cyber .shop-ic {
  border-radius: 10px;
  border-color: rgba(0, 224, 255, .25);
  box-shadow: 0 0 14px rgba(0, 224, 255, .12);
}
body.cyber .price { color: var(--cy-amber); text-shadow: 0 0 10px rgba(255, 209, 102, .3); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
body.cyber .attr { background: rgba(0, 224, 255, .05); border-color: rgba(0, 224, 255, .16); border-radius: 12px; }
body.cyber .attr .v { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--cy-text); }
body.cyber .kpi div { background: rgba(0, 224, 255, .05); border-color: rgba(0, 224, 255, .16); border-radius: 12px; }
body.cyber .kpi b { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
body.cyber .chart .b { background: linear-gradient(180deg, var(--cy-cyan), var(--cy-violet)); box-shadow: 0 0 12px rgba(0, 224, 255, .4); }
body.cyber .log-dot { box-shadow: 0 0 8px currentColor; }
body.cyber .chapter.active { border-left-color: var(--cy-cyan); }
body.cyber .chapter.active .chapter-dot { background: var(--cy-cyan); border-color: var(--cy-cyan); box-shadow: 0 0 14px rgba(0, 224, 255, .7); }
body.cyber .chapter.done .chapter-dot { background: var(--cy-green); border-color: var(--cy-green); box-shadow: 0 0 12px rgba(0, 224, 184, .6); }

/* ---------- effects / toasts ---------- */
body.cyber .effect { border-radius: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
body.cyber .toast {
  background: rgba(6, 12, 24, .98);
  border: 1px solid var(--cy-line-strong);
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 0 18px rgba(0, 224, 255, .16);
}

window.__memStore = false;
(function () {
  try {
    const k = '__liferpg_test__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
  } catch (e) {
    const mem = {};
    const shim = {
      getItem: k => (k in mem ? mem[k] : null),
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: k => { delete mem[k]; },
      clear: () => { Object.keys(mem).forEach(k => delete mem[k]); },
      key: i => Object.keys(mem)[i] || null,
      get length() { return Object.keys(mem).length; }
    };
    try {
      Object.defineProperty(window, 'localStorage', { value: shim, configurable: true });
      window.__memStore = true;
    } catch (_) { window.__memStore = true; }
  }
})();

/* Конструктор квеста. Награды считаются из времени и сложности. */
function Q(title, desc, cat, diff, minutes, prog) {
  const d = DIFFS[diff] || DIFFS[1];
  const xp = Math.round((7 + minutes * 0.85) * d.mult);
  return {
    title, desc, cat, diff, minutes,
    prog: prog || 0,
    xp,
    gold: Math.round(xp * 0.34 + diff * 3),
    energy: Math.max(1, Math.min(12, Math.ceil(minutes / 9))),
    heal: cat === 'body' ? diff * 3 : (cat === 'order' ? diff : 0)
  };
}

];

function guessCats(text) {
  const t = (text || '').toLowerCase();
  for (const [keys, cats] of KEYWORD_CATS) {
    if (keys.some(k => t.includes(k))) return cats;
  }
  return ['mind', 'order'];
}

function shiftDay(str, n) {
  const [y, m, d] = str.split('-').map(Number);
  const x = new Date(y, m - 1, d + n);
  return todayStr(x);
}
function dayDiff(a, b) {
  const p = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
  return Math.round((p(b) - p(a)) / 86400000);
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fmt(n) { return Math.round(n).toLocaleString('ru-RU'); }
function plural(n, a, b, c) { const m = n % 100, k = n % 10; return m > 4 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; }

/* ---------- производные статы ---------- */
const maxHP     = () => 100 + S.attrs.str * 4;
const maxEnergy = () => 100 + S.attrs.dis * 3;
const xpNeed    = (lvl) => Math.round(70 * Math.pow(lvl || S.level, 1.32));
const xpMult    = () => (1 + S.attrs.int * 0.01) * (MODES[S.mode] ? MODES[S.mode].xp : 1) * (S.hp < maxHP() * 0.3 ? 0.8 : 1);
const goldMult  = () => 1 + S.attrs.soc * 0.015;
const discount  = () => Math.min(0.3, S.attrs.cra * 0.005);
const priceOf   = (item) => Math.max(1, Math.round(item.price * (1 - discount())));
const isExhausted = () => S.hp < maxHP() * 0.3;

/* ---------- сохранение ---------- */
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* приватный режим */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !data.goal) return false;
    S = data;
    return true;
  } catch (e) { return false; }
}
function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} S = null; }

function pushLog(text, type) {
  S.log.unshift({ t: Date.now(), text, type: type || 'info' });
  if (S.log.length > 220) S.log.length = 220;
}
function hist(day) {
  if (!S.history[day]) S.history[day] = { xp: 0, gold: 0, done: 0, missed: 0 };
  return S.history[day];
}

/* ---------- новая игра ---------- */
function newGame(o) {
  const base = o.goalId === 'custom'
    ? customCampaign(o.customTitle || 'Моя цель', o.customCats)
    : clone(GOALS.find(g => g.id === o.goalId) || GOALS[0]);

  const bm = base.metric || { label: 'Прогресс по цели', unit: 'ед.', target: 30 };
  const metric = {
    label: (o.metricLabel || bm.label),
    unit: (o.metricUnit || bm.unit),
    target: Number(o.metricTarget) > 0 ? Number(o.metricTarget) : bm.target
  };

  S = {
    v: 1,
    name: o.name || 'Игрок',
    avatar: o.avatar || AVATARS[0],
    mode: MODES[o.mode] ? o.mode : 'normal',
    createdAt: Date.now(),
    level: 1, xp: 0, gold: 40, goldEarned: 40,
    hp: 104, energy: 103,
    attrs: { str: 1, int: 1, dis: 1, soc: 1, cra: 1 },
    goal: {
      id: base.id, emoji: base.emoji, title: base.title, hint: base.hint, cats: base.cats,
      metric, progress: 0,
      deadline: o.deadline || null,
      startedAt: todayStr(),
      chapters: base.chapters.map(ch => ({
        title: ch.title,
        story: ch.story.map(T),
        boss: T(ch.boss),
        done: [],
        bossDone: false
      })),
      chapterIdx: 0, storyIdx: 0, completed: false
    },
    habits: base.habits.map(a => Object.assign(T(a), { uid: uid(), kind: 'habit', streak: 0, best: 0 })),
    sidePool: base.side.map(T),
    today: todayStr(),
    quests: [],
    habitDone: {},
    streak: 0, bestStreak: 0,
    questsDone: 0, bossesDone: 0, skipped: 0,
    focusSessions: 0, focusMinutes: 0,
    catCount: { body: 0, mind: 0, order: 0, social: 0, craft: 0, money: 0 },
    shop: clone(SHOP_DEFAULT),
    purchases: [],
    ach: {},
    log: [],
    history: {},
    focus: null,
    settings: { hints: true }
  };
  S.hp = maxHP(); S.energy = maxEnergy();
  pushLog('Кампания «' + S.goal.title + '» началась. ' + S.goal.chapters[0].title + ' открыта.', 'story');
  buildDaily();
  save();
}

/* ---------- текущий сюжетный шаг ---------- */
function currentChapter() { return S.goal.chapters[S.goal.chapterIdx] || null; }
function storyReady() {
  const ch = currentChapter();
  return !S.goal.completed && ch && S.goal.storyIdx < ch.story.length;
}
function bossReady() {
  const ch = currentChapter();
  return !S.goal.completed && ch && S.goal.storyIdx >= ch.story.length && !ch.bossDone;
}

/* ---------- генерация дня ---------- */
const KIND_RANK = { boss: 0, story: 1, custom: 2, side: 3 };
function sortQuests() { S.quests.sort((a, b) => KIND_RANK[a.kind] - KIND_RANK[b.kind]); }

/* сюжет и босс всегда отражают текущую главу (вызывается после каждого квеста) */
function ensureStory() {
  S.quests = S.quests.filter(q => q.kind !== 'story' && q.kind !== 'boss');
  if (storyReady()) {
    const ch = currentChapter();
    S.quests.unshift(Object.assign(clone(ch.story[S.goal.storyIdx]), {
      uid: uid(), kind: 'story', ref: { c: S.goal.chapterIdx, s: S.goal.storyIdx }
    }));
  }
  if (bossReady()) {
    const ch = currentChapter();
    S.quests.unshift(Object.assign(clone(ch.boss), { uid: uid(), kind: 'boss', ref: { c: S.goal.chapterIdx } }));
  }
  sortQuests();
}

/* побочные квесты дня — бросаются один раз в сутки */
function rollSide() {
  S.quests = S.quests.filter(q => q.kind !== 'side');
  const rand = seeded(hashStr(S.today + '|' + S.goal.id + '|' + S.level));
  const recent = [];
  for (let i = 1; i <= 3; i++) {
    const h = S.history[shiftDay(S.today, -i)];
    if (h && h.titles) recent.push(...h.titles);
  }
  const pool = S.sidePool.concat(GENERIC_SIDE.map(T)).filter(q => !recent.includes(q.title));
  const weak = Object.keys(S.attrs).sort((a, b) => S.attrs[a] - S.attrs[b]).slice(0, 2);
  const weighted = [];
  pool.forEach(q => {
    let w = 1;
    if (S.goal.cats.includes(q.cat)) w += 2;
    if (weak.includes(CATS[q.cat].attr)) w += 1;
    if (q.diff === 3 && S.level < 3) w = Math.max(1, w - 2);
    for (let i = 0; i < w; i++) weighted.push(q);
  });
  const count = S.level >= 5 ? 4 : 3;
  const picked = [];
  let guard = 0;
  while (picked.length < count && weighted.length && guard++ < 200) {
    const q = weighted[Math.floor(rand() * weighted.length)];
    if (!picked.some(p => p.title === q.title)) picked.push(clone(q));
  }
  picked.forEach(q => S.quests.push(Object.assign(q, { uid: uid(), kind: 'side', date: S.today })));
  sortQuests();
}

function buildDaily() { ensureStory(); rollSide(); }

/* ---------- смена дня ---------- */
function rollover() {
  const t = todayStr();
  if (!S || S.today === t) return null;
  const gap = clamp(dayDiff(S.today, t), 1, 60);
  const report = { missed: 0, damage: 0, streakLost: false, newDay: t, burnout: false };
  const pen = MODES[S.mode].penalty;

  for (let i = 0; i < Math.min(gap, 3); i++) {
    const day = shiftDay(S.today, i);
    const doneIds = S.habitDone[day] || [];
    const missed = S.habits.filter(h => !doneIds.includes(h.uid));
    const h = hist(day);
    h.missed = missed.length;
    if (missed.length && pen > 0) {
      const dmg = missed.length * pen;
      S.hp -= dmg;
      report.missed += missed.length;
      report.damage += dmg;
      missed.forEach(m => { m.streak = 0; });
    }
    if (i === 0) {
      const perfect = S.habits.length > 0 && missed.length === 0 && (h.done || 0) > 0;
      if (perfect) {
        S.streak += 1;
        S.bestStreak = Math.max(S.bestStreak, S.streak);
      } else if (S.streak > 0) {
        S.streak = 0; report.streakLost = true;
      }
    } else if (S.streak > 0) { S.streak = 0; report.streakLost = true; }
  }

  if (S.hp <= 0) {
    S.hp = Math.round(maxHP() * 0.35);
    const lost = Math.round(S.gold * 0.15);
    S.gold -= lost; S.streak = 0;
    report.burnout = true;
    pushLog('Выгорание. Персонаж выдохся: −' + fmt(lost) + ' золота, серия сброшена. Отдохни и вернись.', 'bad');
  } else if (report.damage > 0) {
    pushLog('Пропущено привычек: ' + report.missed + '. Здоровье −' + report.damage + '.', 'bad');
  }

  S.today = t;
  S.energy = maxEnergy();
  S.hp = clamp(S.hp + 4, 0, maxHP());
  hist(t);
  buildDaily();
  pushLog('Новый день. Квесты обновлены, энергия восстановлена.', 'day');
  checkAch();
  save();
  return report;
}

/* ---------- выполнение ---------- */
function findQuest(id) {
  return S.quests.find(q => q.uid === id) || S.habits.find(h => h.uid === id);
}
function habitDoneToday(id) { return (S.habitDone[S.today] || []).includes(id); }

function complete(id, extra) {
  const q = findQuest(id);
  if (!q) return { ok: false, msg: 'Квест не найден' };
  if (q.kind === 'habit' && habitDoneToday(id)) return { ok: false, msg: 'Эта привычка уже закрыта сегодня' };

  const res = { ok: true, xp: 0, gold: 0, attr: null, attrGain: 0, levels: [], ach: [], prog: 0, tired: false, chapter: null, heal: 0 };

  // энергия: не хватает — делаем «через силу», платим здоровьем
  if (S.energy < q.energy) {
    const deficit = q.energy - S.energy;
    S.hp -= deficit * 2;
    S.energy = 0;
    res.tired = true;
  } else {
    S.energy -= q.energy;
  }

  let mult = xpMult();
  if (q.kind === 'habit') {
    q.streak = (q.streak || 0) + 1;
    q.best = Math.max(q.best || 0, q.streak);
    mult *= 1 + Math.min(0.5, (q.streak - 1) * 0.05);
  }
  if (S.streak >= 3) mult *= 1 + Math.min(0.3, S.streak * 0.02);

  const xp = Math.max(1, Math.round(q.xp * mult));
  const gold = Math.max(1, Math.round(q.gold * goldMult()));
  S.xp += xp; S.gold += gold; S.goldEarned += gold;
  res.xp = xp; res.gold = gold;

  // атрибут
  const attr = CATS[q.cat].attr;
  const gain = q.kind === 'boss' ? 3 : q.diff === 3 ? 2 : 1;
  S.attrs[attr] += gain;
  res.attr = attr; res.attrGain = gain;
  if (q.kind === 'boss') { S.attrs.dis += 1; }

  // здоровье
  const heal = q.heal || 0;
  if (heal) { S.hp = clamp(S.hp + heal, 0, maxHP()); res.heal = heal; }
  S.hp = clamp(S.hp, 0, maxHP());
  S.energy = clamp(S.energy, 0, maxEnergy());

  // прогресс цели
  let prog = q.prog || 0;
  if (extra && typeof extra.prog === 'number' && extra.prog >= 0) prog = extra.prog;
  if (prog) {
    S.goal.progress += prog;
    res.prog = prog;
  }

  S.questsDone++;
  S.catCount[q.cat] = (S.catCount[q.cat] || 0) + 1;
  const h = hist(S.today);
  h.xp += xp; h.gold += gold; h.done += 1;
  h.titles = (h.titles || []).concat(q.title);

  if (q.kind === 'habit') {
    if (!S.habitDone[S.today]) S.habitDone[S.today] = [];
    S.habitDone[S.today].push(q.uid);
  } else {
    S.quests = S.quests.filter(x => x.uid !== id);
  }

  // продвижение по кампании
  if (q.kind === 'story') {
    const ch = currentChapter();
    ch.done.push(S.goal.storyIdx);
    S.goal.storyIdx++;
    pushLog('Сюжетный квест «' + q.title + '» выполнен. +' + xp + ' опыта.', 'story');
    if (S.goal.storyIdx >= ch.story.length) pushLog('Босс главы доступен: «' + ch.boss.title + '».', 'boss');
  } else if (q.kind === 'boss') {
    const ch = currentChapter();
    ch.bossDone = true;
    S.bossesDone++;
    const bonus = 120 + S.goal.chapterIdx * 80;
    S.gold += bonus; S.goldEarned += bonus; res.gold += bonus;
    S.hp = maxHP(); S.energy = maxEnergy();
    pushLog('🐲 Босс «' + ch.boss.title + '» повержен! Награда +' + bonus + ' золота, здоровье и энергия полностью восстановлены.', 'boss');
    S.goal.chapterIdx++;
    S.goal.storyIdx = 0;
    if (S.goal.chapterIdx >= S.goal.chapters.length) {
      S.goal.completed = true;
      S.goal.chapterIdx = S.goal.chapters.length - 1;
      pushLog('👑 Кампания «' + S.goal.title + '» пройдена. Поставь новую цель — игра продолжается.', 'win');
    } else {
      res.chapter = S.goal.chapters[S.goal.chapterIdx].title;
      pushLog('Открыта ' + res.chapter + '.', 'story');
    }
  } else {
    pushLog('«' + q.title + '» — выполнено. +' + xp + ' опыта, +' + gold + ' золота.', 'good');
  }

  // уровни
  while (S.xp >= xpNeed()) {
    S.xp -= xpNeed();
    S.level++;
    S.hp = maxHP(); S.energy = maxEnergy();
    res.levels.push(S.level);
    pushLog('⭐ Уровень ' + S.level + '! Здоровье и энергия восстановлены.', 'win');
  }

  if (S.hp <= 0) {
    S.hp = Math.round(maxHP() * 0.3);
    pushLog('Ты выжал себя досуха. Персонаж на грани — купи отдых в лавке.', 'bad');
  }

  res.ach = checkAch();
  ensureStory();
  save();
  return res;
}

/* заменить побочный квест на другой */
function reroll(id) {
  const q = S.quests.find(x => x.uid === id);
  if (!q || q.kind !== 'side') return { ok: false };
  const pool = S.sidePool.concat(GENERIC_SIDE.map(T))
    .filter(x => !S.quests.some(y => y.title === x.title));
  if (!pool.length) return { ok: false, msg: 'Все квесты уже в списке' };
  const pick = clone(pool[Math.floor(Math.random() * pool.length)]);
  Object.assign(q, pick, { uid: q.uid, kind: 'side', date: S.today });
  S.skipped++;
  save();
  return { ok: true, quest: q };
}

function skipQuest(id) {
  const q = S.quests.find(x => x.uid === id);
  if (!q) return { ok: false };
  if (q.kind === 'story' || q.kind === 'boss') return { ok: false, msg: 'Сюжетный квест нельзя выбросить — его можно только отложить' };
  S.quests = S.quests.filter(x => x.uid !== id);
  S.skipped++;
  pushLog('Квест «' + q.title + '» отклонён.', 'info');
  save();
  return { ok: true };
}

/* свои квесты и привычки */
function addCustom(o) {
  const q = Q(o.title, o.desc || 'Свой квест. Игра верит тебе на слово.', o.cat || 'order', Number(o.diff) || 1, Number(o.minutes) || 20, Number(o.prog) || 0);
  if (o.recurring) {
    S.habits.push(Object.assign(q, { uid: uid(), kind: 'habit', streak: 0, best: 0, custom: true }));
    pushLog('Новая привычка: «' + q.title + '».', 'info');
  } else {
    S.quests.push(Object.assign(q, { uid: uid(), kind: 'custom', date: S.today, custom: true }));
    pushLog('Добавлен свой квест: «' + q.title + '».', 'info');
  }
  save();
  return { ok: true };
}
function removeHabit(id) {
  const h = S.habits.find(x => x.uid === id);
  if (!h) return { ok: false };
  S.habits = S.habits.filter(x => x.uid !== id);
  pushLog('Привычка «' + h.title + '» убрана из списка.', 'info');
  save();
  return { ok: true };
}

/* прогресс цели вручную */
function addProgress(n) {
  n = Number(n);
  if (!isFinite(n) || n === 0) return { ok: false };
  S.goal.progress = Math.max(0, S.goal.progress + n);
  pushLog('Прогресс цели: ' + (n > 0 ? '+' : '') + fmt(n) + ' ' + S.goal.metric.unit + '.', n > 0 ? 'good' : 'info');
  save();
  return { ok: true };
}
function setGoalFields(o) {
  if (o.title) S.goal.title = o.title;
  if (o.metricLabel) S.goal.metric.label = o.metricLabel;
  if (o.metricUnit) S.goal.metric.unit = o.metricUnit;
  if (Number(o.metricTarget) > 0) S.goal.metric.target = Number(o.metricTarget);
  S.goal.deadline = o.deadline || null;
  save();
  return { ok: true };
}

/* лавка */
function buy(itemId) {
  const item = S.shop.find(i => i.id === itemId);
  if (!item) return { ok: false, msg: 'Нет такой награды' };
  const price = priceOf(item);
  if (S.gold < price) return { ok: false, msg: 'Не хватает ' + fmt(price - S.gold) + ' золота' };
  S.gold -= price;
  S.energy = clamp(S.energy + (item.energy || 0), 0, maxEnergy());
  S.hp = clamp(S.hp + (item.hp || 0), 0, maxHP());
  S.purchases.unshift({ t: Date.now(), title: item.title, price, icon: item.icon });
  if (S.purchases.length > 60) S.purchases.length = 60;
  pushLog('Куплено: ' + item.title + ' за ' + fmt(price) + ' золота. Возьми это в реальной жизни.', 'shop');
  const ach = checkAch();
  save();
  return { ok: true, item, price, ach };
}
function addShopItem(o) {
  S.shop.push({
    id: 'u' + uid(), title: o.title, desc: o.desc || 'Твоя награда за реальные дела.',
    price: Math.max(10, Number(o.price) || 100), icon: o.icon || '🎁',
    energy: Number(o.energy) || 0, hp: Number(o.hp) || 0, custom: true
  });
  save();
  return { ok: true };
}
function removeShopItem(id) { S.shop = S.shop.filter(i => i.id !== id); save(); return { ok: true }; }

/* фокус-сессия */
function startFocus(minutes, questId) {
  S.focus = { end: Date.now() + minutes * 60000, minutes, questId: questId || null };
  save();
}
function cancelFocus() { S.focus = null; save(); }
function finishFocus() {
  if (!S.focus) return { ok: false };
  const m = S.focus.minutes;
  const qid = S.focus.questId;
  S.focus = null;
  S.focusSessions++; S.focusMinutes += m;
  const bonus = Math.round(m * 0.9 * xpMult());
  S.xp += bonus;
  hist(S.today).xp += bonus;
  const levels = [];
  while (S.xp >= xpNeed()) { S.xp -= xpNeed(); S.level++; S.hp = maxHP(); S.energy = maxEnergy(); levels.push(S.level); }
  pushLog('🎯 Фокус-сессия ' + m + ' минут завершена. +' + bonus + ' опыта.', 'good');
  const ach = checkAch();
  save();
  return { ok: true, bonus, levels, ach, questId: qid };
}

/* достижения */
function checkAch() {
  const got = [];
  ACHIEVEMENTS.forEach(a => {
    if (!S.ach[a.id] && a.test(S)) {
      S.ach[a.id] = Date.now();
      got.push(a);
      pushLog('🏆 Достижение: ' + a.title + '.', 'win');
    }
  });
  return got;
}

/* аналитика */
function weekStats() {
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const d = shiftDay(S.today, -i);
    const h = S.history[d] || { xp: 0, done: 0, missed: 0 };
    out.push({ day: d, xp: h.xp || 0, done: h.done || 0, missed: h.missed || 0 });
  }
  return out;
}
function goalPct() { return clamp(S.goal.progress / (S.goal.metric.target || 1) * 100, 0, 100); }
function daysLeft() {
  if (!S.goal.deadline) return null;
  return dayDiff(S.today, S.goal.deadline);
}
function pace() {
  const dl = daysLeft();
  if (dl === null || dl <= 0) return null;
  const remain = Math.max(0, S.goal.metric.target - S.goal.progress);
  return remain / dl;
}

/* экспорт / импорт */
function exportSave() { return JSON.stringify(S, null, 2); }
function importSave(text) {
  try {
    const data = JSON.parse(text);
    if (!data || !data.goal || !data.attrs) return { ok: false, msg: 'Это не файл сохранения Life RPG' };
    S = data; S.today = S.today || todayStr();
    save(); rollover();
    return { ok: true };
  } catch (e) { return { ok: false, msg: 'Файл повреждён' }; }
}

/* смена режима */
function setMode(m) { if (MODES[m]) { S.mode = m; pushLog('Режим изменён: ' + MODES[m].name + '.', 'info'); save(); } }

/* новая кампания с сохранением персонажа */
function startNewGoal(o) {
  const base = o.goalId === 'custom' ? customCampaign(o.customTitle || 'Моя цель', o.customCats) : clone(GOALS.find(g => g.id === o.goalId) || GOALS[0]);
  S.goal = {
    id: base.id, emoji: base.emoji, title: base.title, hint: base.hint, cats: base.cats,
    metric: {
      label: o.metricLabel || (base.metric || {}).label || 'Прогресс по цели',
      unit: o.metricUnit || (base.metric || {}).unit || 'ед.',
      target: Number(o.metricTarget) > 0 ? Number(o.metricTarget) : (base.metric || {}).target || 30
    },
    progress: 0, deadline: o.deadline || null, startedAt: todayStr(),
    chapters: base.chapters.map(ch => ({ title: ch.title, story: ch.story.map(T), boss: T(ch.boss), done: [], bossDone: false })),
    chapterIdx: 0, storyIdx: 0, completed: false
  };
  S.habits = base.habits.map(a => Object.assign(T(a), { uid: uid(), kind: 'habit', streak: 0, best: 0 }));
  S.sidePool = base.side.map(T);
  S.quests = [];
  pushLog('Новая кампания: «' + S.goal.title + '». Персонаж сохранил уровень и статы.', 'story');
  buildDaily();
  save();
  return { ok: true };
}

const $ = s => document.querySelector(s);

let TICK = null;

const RANKS = [
  [1, 'Новичок'], [3, 'Ученик'], [5, 'Подмастерье'], [8, 'Специалист'],
  [12, 'Мастер'], [16, 'Эксперт'], [20, 'Легенда'], [26, 'Миф']
];
function rankName(lvl) { let r = RANKS[0][1]; RANKS.forEach(([l, n]) => { if (lvl >= l) r = n; }); return r; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function dowName(d) { return ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'][new Date(d + 'T12:00:00').getDay()]; }
function dateHuman(d) {
  const m = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const x = new Date(d + 'T12:00:00');
  return x.getDate() + ' ' + m[x.getMonth()];
}
function timeHuman(t) {
  const d = new Date(t), n = new Date();
  const same = d.toDateString() === n.toDateString();
  const hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  return same ? hh : d.getDate() + '.' + String(d.getMonth() + 1).padStart(2, '0') + ' ' + hh;
}

/* ================= ТОСТЫ / ЭФФЕКТЫ ================= */
function toast(text, kind) {
  let box = $('.toasts');
  if (!box) { box = document.createElement('div'); box.className = 'toasts'; document.body.appendChild(box); }
  const el = document.createElement('div');
  if (document.getElementById('overlay')) box.classList.add('top');
  el.className = 'toast ' + (kind || '');
  el.innerHTML = text;
  box.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; setTimeout(() => el.remove(), 320); }, 2600);
}
function levelUpFX(level) {
  const el = document.createElement('div');
  el.className = 'levelup';
  const colors = ['#ffd166', '#ff8a5c', '#b06cff', '#00e0b8', '#56d8ff'];
  let sparks = '';
  for (let i = 0; i < 26; i++) {
    sparks += `<span class="spark" style="left:${Math.random() * 100}%;top:-10px;background:${colors[i % colors.length]};animation-delay:${Math.random() * .6}s"></span>`;
  }
  el.innerHTML = `${sparks}<div class="inner">
    <div class="big">⭐</div>
    <div class="t">УРОВЕНЬ ${level}</div>
    <div class="muted small" style="margin-top:6px">${rankName(level)} · здоровье и энергия восстановлены</div>
    <button class="btn primary" style="margin-top:16px" data-act="close-lvl">Продолжить</button>
  </div>`;
  document.body.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 4200);
}

function sheet(title, body, footer) {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.id = 'overlay';
  ov.innerHTML = `<div class="sheet">
    <div class="sheet-handle"></div>
    <div class="spread" style="margin-bottom:14px">
      <h2>${title}</h2>
      <button class="btn sm ghost" data-act="close" style="font-size:18px;line-height:1;padding:6px 12px">×</button>
    </div>
    ${body}
    ${footer ? `<div style="margin-top:14px">${footer}</div>` : ''}
  </div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
  const tb = document.querySelector('.toasts'); if (tb) tb.classList.add('top');
}
